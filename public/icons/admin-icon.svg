<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D47F"/><stop offset="0.55" stop-color="#D4A84B"/><stop offset="1" stop-color="#A7782A"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FBF1D9"/><stop offset="0.6" stop-color="#F1E2BE"/><stop offset="1" stop-color="#E2CC9C"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#8C5C17"/><stop offset="0.42" stop-color="#C99536"/><stop offset="0.55" stop-color="#9A6A1E"/><stop offset="1" stop-color="#6E4814"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30271B"/><stop offset="1" stop-color="#1B160F"/>
    </linearGradient>
    <linearGradient id="flapSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2F21"/><stop offset="1" stop-color="#231C13"/>
    </linearGradient>
    <linearGradient id="backFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16120D"/><stop offset="1" stop-color="#241D15"/>
    </linearGradient>
    <radialGradient id="wax" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#D23F33"/><stop offset="0.55" stop-color="#9C2119"/><stop offset="1" stop-color="#5A0F0B"/>
    </radialGradient>
    <radialGradient id="waxWell" cx="0.6" cy="0.65" r="0.8">
      <stop offset="0" stop-color="#A82A21"/><stop offset="1" stop-color="#6A140F"/>
    </radialGradient>
    <linearGradient id="wellRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A0F0B" stop-opacity="0.9"/><stop offset="1" stop-color="#F08A7E" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur6" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur10" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur1" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <!-- Domed bevel lit from the top-left. -->
    <filter id="dome" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="h"/>
      <feSpecularLighting in="h" surfaceScale="6" specularConstant="0.8" specularExponent="20" lighting-color="#FFD9CF" result="s">
        <feDistantLight azimuth="225" elevation="42"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3="0.38" k4="0"/>
    </filter>
    <!-- Small raised bevel for lettering (wax relief and foil ink). -->
    <filter id="relief" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="h"/>
      <feSpecularLighting in="h" surfaceScale="3" specularConstant="0.9" specularExponent="26" lighting-color="#FFE6A8" result="s">
        <feDistantLight azimuth="225" elevation="50"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3="0.35" k4="0"/>
    </filter>
    <filter id="waxRelief" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="h"/>
      <feSpecularLighting in="h" surfaceScale="3" specularConstant="0.8" specularExponent="22" lighting-color="#FFC9BF" result="s">
        <feDistantLight azimuth="225" elevation="48"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3="0.4" k4="0"/>
    </filter>

    <clipPath id="env"><rect x="48" y="232" width="416" height="228" rx="24"/></clipPath>
    <clipPath id="cardClip"><rect x="104" y="34" width="304" height="360" rx="16"/></clipPath>
  </defs>

  <rect id="bg" width="512" height="512" rx="104" fill="#12100C"/>

  <!-- whole envelope casts a soft shadow -->
  <rect x="54" y="246" width="404" height="228" rx="24" fill="#000" opacity="0.55" filter="url(#blur10)"/>

  <!-- back of envelope + opened flap -->
  <rect x="48" y="232" width="416" height="228" rx="24" fill="#241D15"/>
  <path d="M 48,232 L 256,96 L 464,232 Z" fill="url(#backFlap)" stroke="url(#goldH)" stroke-width="7" stroke-linejoin="round"/>

  <!-- the card -->
  <rect x="108" y="42" width="304" height="360" rx="16" fill="#000" opacity="0.45" filter="url(#blur6)"/>
  <rect x="104" y="34" width="304" height="360" rx="16" fill="url(#paper)"/>
  <path d="M 120,35.5 L 392,35.5" stroke="#FFFFFF" stroke-width="2" opacity="0.7" stroke-linecap="round"/>

  <!-- foil-pressed lettering: soft shadow, light edge, then the ink with a relief bevel -->
  <g filter="url(#blur1)" opacity="0.45"><text x="258.5" y="153.5" text-anchor="middle" font-family="LiaHalel" font-size="148" fill="#3A2508">ת"ח</text><text x="258.5" y="239.5" text-anchor="middle" font-family="LiaHalel" font-size="148" fill="#3A2508">ת"ח</text></g>
  <g opacity="0.85"><text x="254.8" y="148.8" text-anchor="middle" font-family="LiaHalel" font-size="148" fill="#FFF8E4">ת"ח</text><text x="254.8" y="234.8" text-anchor="middle" font-family="LiaHalel" font-size="148" fill="#FFF8E4">ת"ח</text></g>
  <g filter="url(#relief)"><text x="256" y="150" text-anchor="middle" font-family="LiaHalel" font-size="148" fill="url(#ink)">ת"ח</text><text x="256" y="236" text-anchor="middle" font-family="LiaHalel" font-size="148" fill="url(#ink)">ת"ח</text></g>
  <path d="M 170,268 C 202,254 228,278 256,266 S 316,252 344,264" fill="none" stroke="#3A2508" stroke-width="5" stroke-linecap="round" opacity="0.3" filter="url(#blur1)" transform="translate(1.5,2.5)"/>
  <path d="M 170,268 C 202,254 228,278 256,266 S 316,252 344,264" fill="none" stroke="url(#ink)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- pocket edge shades the card -->
  <g clip-path="url(#cardClip)">
    <path d="M 48,232 L 256,356 L 464,232" fill="none" stroke="#000" stroke-width="28" opacity="0.5" filter="url(#blur6)" transform="translate(0,-9)"/>
  </g>

  <!-- front pocket -->
  <g clip-path="url(#env)">
    <path d="M 48,232 L 256,356 L 464,232 L 464,460 L 48,460 Z" fill="url(#pocket)"/>
    <path d="M 48,232 L 232,342 L 48,460 Z" fill="url(#flapSide)"/>
    <path d="M 464,232 L 280,342 L 464,460 Z" fill="url(#flapSide)"/>
    <path d="M 48,460 L 256,338 L 464,460 Z" fill="#000" opacity="0.35" filter="url(#blur6)" transform="translate(0,-6)"/>
    <path d="M 48,460 L 256,338 L 464,460 Z" fill="url(#pocket)" stroke="url(#goldH)" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <path d="M 48,232 L 256,356 L 464,232" fill="none" stroke="url(#goldH)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 48,232 L 48,436 Q 48,460 72,460 L 440,460 Q 464,460 464,436 L 464,232" fill="none" stroke="url(#goldH)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- wax seal -->
  <path d="M 300.4,364.0 Q 301.5,374.4 298.4,384.4 Q 292.5,393.1 282.9,397.7 Q 276.2,406.0 266.8,411.2 Q 256.0,410.6 246.4,406.0 Q 235.8,406.0 226.6,400.8 Q 219.5,393.1 216.0,383.3 Q 210.5,374.4 208.9,364.0 Q 210.5,353.6 217.2,345.3 Q 219.5,334.9 225.8,326.2 Q 235.8,322.0 246.4,322.0 Q 256.0,317.4 266.5,318.1 Q 276.2,322.0 283.7,329.3 Q 292.5,334.9 298.4,343.6 Q 301.5,353.6 299.1,364.0 Z" fill="#000" opacity="0.55" filter="url(#blur6)"/>
  <g filter="url(#dome)"><path d="M 300.4,356.0 Q 301.5,366.4 298.4,376.4 Q 292.5,385.1 282.9,389.7 Q 276.2,398.0 266.8,403.2 Q 256.0,402.6 246.4,398.0 Q 235.8,398.0 226.6,392.8 Q 219.5,385.1 216.0,375.3 Q 210.5,366.4 208.9,356.0 Q 210.5,345.6 217.2,337.3 Q 219.5,326.9 225.8,318.2 Q 235.8,314.0 246.4,314.0 Q 256.0,309.4 266.5,310.1 Q 276.2,314.0 283.7,321.3 Q 292.5,326.9 298.4,335.6 Q 301.5,345.6 299.1,356.0 Z" fill="url(#wax)"/></g>
  <circle cx="256" cy="356" r="31" fill="url(#waxWell)"/>
  <circle cx="256" cy="356" r="31" fill="none" stroke="url(#wellRim)" stroke-width="3.5"/>
  <g filter="url(#blur1)" opacity="0.55"><text x="257.5" y="370.5" text-anchor="middle" font-family="LiaHalel" font-size="46" fill="#3E0B08">ת"ח</text></g>
  <g filter="url(#waxRelief)"><text x="256" y="369" text-anchor="middle" font-family="LiaHalel" font-size="46" fill="#BE3529">ת"ח</text></g>
  <ellipse cx="240" cy="334" rx="16" ry="8" fill="url(#gloss)" transform="rotate(-30 240 334)"/>
</svg>