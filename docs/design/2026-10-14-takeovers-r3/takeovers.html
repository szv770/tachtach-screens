<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TachTach Takeovers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Rubik:wght@400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Owner-uploaded fonts (data/fonts.json → data/fonts/<id>.ttf). Family name = the name the owner gave it. */
@font-face { font-family: 'FbMazalMedium';       src: url('fonts/639a27fb-e8a2-4ecd-9bd9-1ec66b07e521.ttf') format('truetype'); }
@font-face { font-family: 'LiaShaharit Regular 1'; src: url('fonts/335be0ec-dc21-409c-bbc8-e10972958e94.ttf') format('truetype'); }
@font-face { font-family: '1ShefaClassic';       src: url('fonts/1878d33d-34ff-495a-8a4a-7522a59e4b9a.ttf') format('truetype'); }
@font-face { font-family: 'BAWSVenezia Regular'; src: url('fonts/6a5c0f34-1ccc-45f6-9775-0f65cd3526c4.ttf') format('truetype'); }
@font-face { font-family: 'LiaHalel Regular';    src: url('fonts/0307dc9e-66e5-4fe7-88fd-19af31186c21.ttf') format('truetype'); }

/* ═════════════ TachTach takeovers · round 3 ═════════════
   BASE ROLES come from tokens.js exactly as in R2 (--bg --text --dim --muted --accent --onAccent --lift --liftPct).
   A takeover STYLE only overrides STAGE ROLES, always derived from the base roles with color-mix():
     --s-bg  stage surface        --s-ink  primary type      --s-dim  secondary type
     --s-acc the one accent       --s-onacc type on accent   --s-accText accent used as type
     --s-fill/--s-fillInk  time tile         --s-line hairlines
     --a1..--a4  graphic hues (SVG art)      --sheet  an inner surface (scroll / doorway / page)
   FONT ROLES only (never a family name in a style):
     --f-he-disp --f-he --f-en-disp --f-en --f-num --f-th-he --f-th-en   (+ --he-scale)
     a style picks a role for its display type: --f-disp-he / --f-disp-en / --f-big (numerals)
   MOTION: entrance only, ≤1.2 s, opacity + transform, on small bbox-sized layers. No loops/blur/blend. */

@property --bg      { syntax: '<color>'; inherits: true; initial-value: #000; }
@property --text    { syntax: '<color>'; inherits: true; initial-value: #fff; }
@property --dim     { syntax: '<color>'; inherits: true; initial-value: #aaa; }
@property --muted   { syntax: '<color>'; inherits: true; initial-value: #666; }
@property --accent  { syntax: '<color>'; inherits: true; initial-value: #888; }
@property --onAccent{ syntax: '<color>'; inherits: true; initial-value: #000; }
@property --lift    { syntax: '<color>'; inherits: true; initial-value: #fff; }
@property --liftPct { syntax: '<percentage>'; inherits: true; initial-value: 6%; }
:root { --raised: color-mix(in srgb, var(--lift) var(--liftPct), var(--bg)); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); overflow: hidden; }
body { width: 1600px; height: 900px; color: var(--text); font-family: var(--f-en); -webkit-font-smoothing: antialiased; }
.he { direction: rtl; font-family: var(--f-he); font-synthesis: none; }
.num { font-family: var(--f-big); font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum" 1, "tnum" 1; }

/* ── stage ── */
.stage {
  --s-bg: var(--bg); --s-ink: var(--text); --s-dim: var(--dim);
  --s-acc: var(--accent); --s-onacc: var(--onAccent); --s-accText: var(--s-acc);
  --s-fill: var(--s-acc); --s-fillInk: var(--s-onacc);
  --s-line: color-mix(in srgb, var(--s-ink) 16%, transparent);
  --s-faint: color-mix(in srgb, var(--s-ink) 7%, transparent);
  --a1: var(--s-acc); --a2: var(--s-acc); --a3: var(--s-acc); --a4: var(--s-acc);
  --sheet: var(--raised);
  --f-disp-he: var(--f-he-disp); --f-disp-en: var(--f-en-disp); --f-big: var(--f-num);
  --disp-w: 700; --tile-w: 700; --qt-w: 300; --en-track: -.03em;
  position: relative; width: 1600px; height: 900px; overflow: hidden;
  background: var(--s-bg); color: var(--s-ink);
}
/* readability floor: light families' secondary type never drops below 74% ink (tokens.js dim is 58%) */
.light .stage { --s-dim: color-mix(in srgb, var(--s-ink) 74%, transparent); }
.art { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.lay { position: absolute; }
.lay > svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chrome { position: absolute; z-index: 4; font-size: 28px; font-weight: 600; color: var(--s-dim); line-height: 1; }
.chrome.bh { font-family: var(--f-he); font-size: calc(30px * var(--he-scale)); font-weight: 500; direction: rtl; }
.box { position: absolute; z-index: 3; }
.box > .lyt { position: absolute; inset: 0; }

/* svg art vocabulary: one monoline language for every style */
.ln  { fill: none; stroke: var(--a1); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ln2 { fill: none; stroke: var(--a2); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

/* ── type helpers ── */
.fit { white-space: nowrap; overflow: hidden; line-height: 1.14; }
.fit.wrap { white-space: normal; text-wrap: balance; }
.disp-he { font-family: var(--f-disp-he); font-weight: var(--disp-w); direction: rtl; font-synthesis: none; }
.disp-en { font-family: var(--f-disp-en); font-weight: var(--disp-w); letter-spacing: var(--en-track); }
.kick { font-size: 34px; font-weight: 600; color: var(--s-accText); display: flex; gap: 22px; align-items: baseline; margin-bottom: 10px; }
.kick .he { font-size: calc(36px * var(--he-scale)); font-weight: 600; }
.center .kick { justify-content: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--s-line); display: inline-block; align-self: center; flex: none; }

/* ── LAYOUT: big words ── */
.bw { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.start .bw { align-items: flex-start; text-align: left; }
.bw .w-he { height: 42%; width: 100%; color: var(--s-accText); text-align: center; line-height: 1.12; }
.start .bw .w-he { text-align: left; }
.bw .w-en { height: 23%; width: 94%; font-weight: var(--en-w, 600); letter-spacing: -.02em; margin-top: 10px; line-height: 1.16; font-family: var(--f-disp-en); }
.start .bw .w-en { width: 100%; }
.bw .sub { margin-top: 26px; font-size: 32px; color: var(--s-dim); font-weight: 500; display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; justify-content: center; }
.start .bw .sub { justify-content: flex-start; }
.bw .sub .he { font-size: calc(34px * var(--he-scale)); }

/* ── LAYOUT: event card ── */
.ev { display: flex; flex-direction: column; }
.ev .titles { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.ev .h-he { height: 34%; text-align: left; }
.ev .h-en { height: 22%; }
.center .ev .titles { align-items: center; text-align: center; } .center .ev .h-he { text-align: center; width: 100%; } .center .ev .h-en { width: 100%; }
.ev .foot { flex: none; display: flex; align-items: center; gap: 44px; }
.center .ev .foot { justify-content: center; }
.narrow .ev .foot { flex-direction: column; align-items: flex-start; gap: 18px; } .center.narrow .ev .foot { align-items: center; }
.tile { background: var(--s-fill); color: var(--s-fillInk); border-radius: 30px; padding: 22px 40px 26px; display: flex; align-items: center; gap: 34px; flex: none; }
.tile .day { font-size: 38px; font-weight: 600; line-height: 1.15; white-space: nowrap; }
.tile .day.he { font-size: calc(32px * var(--he-scale)); font-weight: 500; color: color-mix(in srgb, currentColor 80%, transparent); }
.tile .t { font-size: var(--tile-size, 140px); font-weight: var(--tile-w); letter-spacing: -.05em; line-height: .9; white-space: nowrap; }
.tile .t small { font-size: .28em; letter-spacing: 0; font-weight: 600; margin-left: 10px; color: color-mix(in srgb, currentColor 78%, transparent); }
.place { min-width: 0; }
.place .en { font-size: 42px; font-weight: 600; line-height: 1.15; }
.place .en2 { font-size: 30px; color: var(--s-dim); font-weight: 500; margin-top: 4px; }
.place .he { font-size: calc(34px * var(--he-scale)); color: var(--s-dim); text-align: left; margin-top: 6px; }
.center .place .he { text-align: center; } .center .place { text-align: center; }
.narrow .place .en { font-size: 36px; } .narrow .place .en2 { font-size: 27px; }

/* ── LAYOUT: list ── */
.ls { display: flex; flex-direction: column; }
.ls .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 30px; margin-bottom: 20px; }
.ls .hd .en { font-size: 64px; line-height: 1.1; } .ls .hd .he { font-size: calc(58px * var(--he-scale)); line-height: 1.1; color: var(--s-accText); }
.ls .items { flex: 1; display: grid; grid-auto-rows: minmax(0, 1fr); min-height: 0; }
.li { display: grid; grid-template-columns: 210px 1fr auto; align-items: center; column-gap: 28px; border-top: 2px solid var(--s-line); }
.li.nod { grid-template-columns: 1fr auto; }
.li .d { font-size: 32px; font-weight: 600; color: var(--s-dim); }
.li .d.soon, .li.soon .tm { color: var(--s-accText); }
.li .x { font-size: 42px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; min-width: 0; }
.li .x .he { display: block; font-size: calc(30px * var(--he-scale)); font-weight: 500; color: var(--s-dim); text-align: left; margin-top: 2px; }
.li .tm { font-size: 54px; font-weight: 650; letter-spacing: -.035em; white-space: nowrap; }
.li .tm small { font-size: 20px; font-weight: 600; letter-spacing: 0; margin-left: 6px; color: var(--s-dim); }
.narrow .li { grid-template-columns: 150px 1fr auto; column-gap: 20px; } .narrow .li .d { font-size: 25px; } .narrow .li .x { font-size: 32px; } .narrow .ls .hd .en { font-size: 52px; }

/* ── LAYOUT: quick time (one time, two times, or a changed time) ── */
.qt { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.start .qt { align-items: flex-start; text-align: left; }
.qt .nm { display: flex; align-items: baseline; gap: calc(34px * var(--k, 1)); max-width: 100%; white-space: nowrap; }
.qt .nm .he { font-size: calc(90px * var(--he-scale) * var(--k, 1)); line-height: 1.1; }
.qt .nm .en { font-size: calc(78px * var(--k, 1)); line-height: 1.1; }
.qt .big { height: 40%; width: 100%; font-weight: var(--qt-w); letter-spacing: -.06em; line-height: 1; color: var(--s-accText); text-align: inherit; }
.qt .big small { font-size: .22em; font-weight: 500; letter-spacing: 0; margin-left: .18em; color: inherit; }
.qt .big .pre { font-size: .2em; font-weight: 500; letter-spacing: 0; margin-right: .25em; color: var(--s-dim); }
.qt .was { font-size: 34px; color: var(--s-dim); font-weight: 500; margin-top: -4px; display: flex; gap: 14px; align-items: baseline; }
.qt .was s { text-decoration-thickness: 3px; color: var(--s-dim); }
.qt .where { font-size: 36px; color: var(--s-dim); font-weight: 500; margin-top: 18px; display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
.center .qt .where, .center .qt .was { justify-content: center; }
.qt .where .he { font-size: calc(34px * var(--he-scale)); }
.qt .times { display: flex; width: 100%; margin: 34px 0 6px; }
.qt .tcol { flex: 1; min-width: 0; padding: 4px 44px 0; }
.start .qt .tcol:first-child { padding-left: 0; }
.qt .tcol + .tcol { border-left: 2px solid var(--s-line); }
.qt .tcol .lab { display: flex; flex-direction: column; gap: 4px; }
.start .qt .tcol .lab { align-items: flex-start; } .center .qt .tcol .lab { align-items: center; }
.qt .tcol .lab .he { font-size: calc(40px * var(--he-scale)); font-weight: 600; }
.qt .tcol .lab .en { font-size: 28px; color: var(--s-dim); font-weight: 500; }
.qt .tcol .t { font-size: var(--t2-size, 150px); font-weight: var(--qt-w); letter-spacing: -.055em; line-height: 1; margin-top: 10px; color: var(--s-accText); white-space: nowrap; }
.qt .tcol .t small { font-size: .26em; font-weight: 500; letter-spacing: 0; margin-left: .16em; }

/* ── LAYOUT: inspiration (quote · sicha · letter) ── */
.qq { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.qq .q-he { width: 94%; height: 40%; font-family: var(--f-th-he); font-weight: 500; direction: rtl; text-align: center; line-height: 1.22; }
.qq .q-en { width: 84%; height: 18%; font-family: var(--f-th-en); font-style: italic; font-weight: 400; color: var(--s-dim); line-height: 1.25; margin-top: 18px; }
.qq .rule { width: 72px; height: 3px; border-radius: 2px; background: var(--s-accText); margin: 30px 0 22px; flex: none; }
.qq .attr { font-size: 30px; color: var(--s-dim); font-weight: 500; display: flex; gap: 18px; align-items: baseline; }
.qq .attr .he { font-family: var(--f-th-he); font-size: calc(32px * var(--he-scale)); }
.sc { display: flex; flex-direction: column; }
.sc .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding-bottom: 20px; border-bottom: 2px solid var(--s-line); }
.sc .hd .en { font-family: var(--f-th-en); font-size: 44px; font-weight: 600; letter-spacing: -.01em; }
.sc .hd .he { font-family: var(--f-th-he); font-size: calc(40px * var(--he-scale)); font-weight: 500; color: var(--s-accText); }
.sc .body { flex: 1; min-height: 0; overflow: hidden; margin-top: 26px; font-family: var(--f-th-en); font-size: 38px; line-height: 1.5; font-weight: 400; text-wrap: pretty; max-width: 31em; }
.sc .body p + p { margin-top: .6em; }
.ft { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 16px; font-size: 26px; color: var(--s-dim); font-weight: 500; }
.ft .pg { display: flex; align-items: center; gap: 14px; }
.ft .pg i { width: 34px; height: 5px; border-radius: 3px; background: var(--s-line); }
.ft .pg i.on { background: var(--s-accText); }
.lt { display: flex; flex-direction: column; direction: rtl; }
.lt .top { font-family: var(--f-th-he); color: var(--s-dim); font-size: calc(28px * var(--he-scale)); line-height: 1.4; }
.lt .sal { font-family: var(--f-th-he); font-size: calc(42px * var(--he-scale)); font-weight: 700; margin: 14px 0 8px; color: var(--s-accText); }
.lt .body { flex: 1; min-height: 0; overflow: hidden; font-family: var(--f-th-he); font-size: calc(35px * var(--he-scale)); line-height: 1.6; text-align: right; text-wrap: pretty; }
.lt .close { font-family: var(--f-th-he); font-size: calc(36px * var(--he-scale)); font-weight: 700; text-align: left; margin-top: 20px; }
.lt .ft { direction: ltr; }

/* ═════════════ STYLES ═════════════
   Each block: stage roles for the dark family, then `.light` overrides (chosen by luminance, as in R2). */

/* classic — the theme exactly; one raised panel, one accent (light themes deepen the tile fill 12% so white type holds 4.5:1) */
.light .st-classic { --s-fill: color-mix(in srgb, var(--s-acc) 88%, #000); }
.st-classic .panelbg { position: absolute; inset: 28px; border-radius: 40px; background: var(--raised); z-index: 0; }

/* grand — gold, Torah-text display, engraved double keyline with notched corners */
.st-grand { --s-bg: color-mix(in srgb, #000 26%, var(--bg)); --s-acc: #D6AF5C; --s-onacc: #1A1408;
  --f-disp-he: var(--f-th-he); --f-disp-en: var(--f-th-en); --f-big: var(--f-th-en); --disp-w: 600; --tile-w: 500; --en-track: -.01em; }
.light .st-grand { --s-bg: color-mix(in srgb, #FFF 50%, var(--bg)); --s-acc: #87631A; --s-onacc: #FFF; }
.st-grand .tile { box-shadow: 0 0 0 2px var(--s-bg), 0 0 0 4px color-mix(in srgb, var(--s-acc) 60%, transparent); border-radius: 6px; }

/* emergency — signal red, white type, hazard edge; never subtle */
.st-emergency { --s-bg: #A3170F; --s-ink: #FFFFFF; --s-dim: rgba(255,255,255,.92); --s-acc: #FFFFFF; --s-onacc: #A3170F;
  --s-line: rgba(255,255,255,.32); --a1: #FFFFFF; --a2: rgba(0,0,0,.30); --disp-w: 800; }
.light .st-emergency { --s-bg: #A91F17; --s-onacc: #A91F17; --s-dim: rgba(255,255,255,.92); --a2: rgba(255,255,255,.26); }

/* sleek — monochrome, light numerals, a ruler */
.st-sleek { --s-acc: var(--s-ink); --s-onacc: var(--s-bg); --s-accText: var(--s-ink); --a1: color-mix(in srgb, var(--s-ink) 42%, transparent);
  --a2: color-mix(in srgb, var(--s-ink) 20%, transparent); --disp-w: 500; --tile-w: 300; --qt-w: 200; }
.st-sleek .tile { background: transparent; color: var(--s-ink); box-shadow: inset 0 0 0 2px var(--s-line); }

/* celebration — fixed warm palette (no longer the theme accent), frozen confetti */
.st-celebration { --s-bg: color-mix(in srgb, #2A0E22 74%, var(--bg)); --s-ink: color-mix(in srgb, #FFF4E6 78%, var(--text));
  --s-dim: color-mix(in srgb, var(--s-ink) 70%, transparent); --s-acc: #EDBE5E; --s-onacc: #2A0E22;
  --a1: #EDBE5E; --a2: #E68C9F; --a3: #6CC7B8; --a4: #F4E7CC; --disp-w: 800; }
.light .st-celebration { --s-bg: color-mix(in srgb, #FFF8EC 66%, var(--bg)); --s-ink: color-mix(in srgb, #3A1026 72%, var(--text));
  --s-acc: #A8325A; --s-onacc: #FFF; --a1: #D9A23A; --a2: #C9486F; --a3: #2F9A8C; --a4: #6E8FD6; }

/* urgent — amber ring + folded corner; attention without alarm */
.st-urgent { --s-acc: #F2A33A; --s-onacc: #1E1405; --s-bg: color-mix(in srgb, #F2A33A 7%, var(--bg)); }
.light .st-urgent { --s-acc: #B05C08; --s-onacc: #FFF; --s-bg: color-mix(in srgb, #F2A33A 9%, color-mix(in srgb, #FFF 40%, var(--bg))); }

/* torah — an open scroll between two atzei chaim; parchment sheet; antique gold */
.st-torah { --s-bg: color-mix(in srgb, #C9A46A 7%, var(--bg)); --sheet: color-mix(in srgb, #C9A46A 13%, var(--raised));
  --s-acc: #CFA155; --s-onacc: #1C1206; --a1: #CFA155; --a2: color-mix(in srgb, #CFA155 30%, var(--s-bg));
  --f-disp-he: var(--f-th-he); --f-disp-en: var(--f-th-en); --disp-w: 600; --en-track: -.01em; }
.light .st-torah { --s-bg: color-mix(in srgb, #C9A46A 30%, var(--bg)); --sheet: color-mix(in srgb, #FBF1DA 80%, #FFF);
  --s-acc: #7A5520; --s-onacc: #FFF; --a1: #8E6A2E; --a2: color-mix(in srgb, #C9A46A 45%, #FFF); }

/* trip — teal route, bus, contour map */
.st-trip { --s-acc: #5BBCD0; --s-onacc: #06181C; --s-bg: color-mix(in srgb, #5BBCD0 7%, var(--bg)); }
.light .st-trip { --s-acc: #156E7E; --s-onacc: #FFF; --s-bg: color-mix(in srgb, #5BBCD0 9%, color-mix(in srgb, #FFF 40%, var(--bg))); }

/* phone — indigo, outlined tile, phone into the box */
.st-phone { --s-acc: #A3AEFF; --s-onacc: #0B0F2A; --s-bg: color-mix(in srgb, #7D8BFF 7%, var(--bg)); --tile-w: 600; }
.light .st-phone { --s-acc: #3E4CC0; --s-onacc: #FFF; --s-bg: color-mix(in srgb, #7D8BFF 8%, color-mix(in srgb, #FFF 40%, var(--bg))); }
.st-phone .tile { background: transparent; color: var(--s-acc); box-shadow: inset 0 0 0 4px var(--s-acc); }

/* memorial — accent-free type, one yahrzeit candle, slow fade */
.st-memorial { --s-bg: color-mix(in srgb, #000 42%, var(--bg)); --s-ink: color-mix(in srgb, var(--text) 86%, var(--s-bg));
  --s-dim: color-mix(in srgb, var(--s-ink) 64%, transparent); --s-acc: var(--s-ink); --s-onacc: var(--s-bg); --s-accText: var(--s-ink);
  --a1: color-mix(in srgb, var(--s-ink) 46%, transparent); --a2: #EDB566; --a3: #FFF0CC;
  --f-disp-he: var(--f-th-he); --f-disp-en: var(--f-th-en); --f-big: var(--f-th-en); --disp-w: 500; --en-w: 500; --tile-w: 400; --qt-w: 400; --en-track: -.005em; }
.light .st-memorial { --s-bg: color-mix(in srgb, var(--text) 6%, color-mix(in srgb, #FFF 30%, var(--bg))); --s-ink: var(--text);
  --a1: color-mix(in srgb, var(--s-ink) 52%, transparent); --a2: #D48A24; --a3: #FFF6DE; }
.st-memorial .tile { background: transparent; color: var(--s-ink); box-shadow: inset 0 0 0 2px var(--s-line); }

/* hype — red-orange, heavy, static sunburst + speed bars */
.st-hype { --s-acc: #FF6A45; --s-onacc: #1A0904; --s-bg: color-mix(in srgb, #FF5B3A 8%, var(--bg)); --disp-w: 800; --qt-w: 800; }
.light .st-hype { --s-acc: #D23A1A; --s-onacc: #FFF; --s-bg: color-mix(in srgb, #FF5B3A 6%, color-mix(in srgb, #FFF 45%, var(--bg))); }

<script>
/* ── themes: R2's 10, verbatim ── */
const THEMES = {

  sepia:        { bg:'#2A2118', text:'#F0DFC0', dim:'rgba(240,223,192,.75)', muted:'rgba(240,223,192,.40)', gold:'#D4A84B' },
  'clean-white':{ bg:'#F7F8FA', text:'#1A1D23', dim:'rgba(26,29,35,.58)',    muted:'rgba(26,29,35,.25)',    gold:'#3B6B96' },
  ivory:        { bg:'#F5F0E6', text:'#2C1E0E', dim:'rgba(44,30,14,.58)',    muted:'rgba(44,30,14,.25)',    gold:'#9B7530' },

const P = { style: q.get('style') || 'celebration', layout: q.get('layout'), theme: q.get('theme') || 'midnight', fonts: q.get('fonts') || 'default',

const F = { ...(FONTSETS[P.fonts] || FONTSETS.default) };

/* ── tiny helpers ── */

/* ═════════════ ART — one function per style; returns layers ═════════════ */

  classic() {

  },

  grand() {
    const W = 1600, H = 900;
    const notch = (i, r) => `M${i + r} ${i} H${W - i - r} A${r} ${r} 0 0 0 ${W - i} ${i + r} V${H - i - r} A${r} ${r} 0 0 0 ${W - i - r} ${H - i} H${i + r} A${r} ${r} 0 0 0 ${i} ${H - i - r} V${i + r} A${r} ${r} 0 0 0 ${i + r} ${i}Z`;
    const dia = (x, y, s) => `<path d="M${x} ${y - s} L${x + s} ${y} L${x} ${y + s} L${x - s} ${y}Z" style="fill:var(--s-acc)"/>`;
    const cartouche = y => `<rect x="${800 - 70}" y="${y - 8}" width="140" height="16" style="fill:var(--s-bg)"/>${dia(800, y, 9)}

      const inCentre = x > 250 && x < 1350 && y > 200 && y < 800;
      if (inCentre || (y < 96 && (x < 300 || x > 1440))) continue;   // keep clear of the text and of the clock / ב״ה
      const edge = Math.min(x, 1600 - x) / 800, top = y / 900;          // denser at top corners, sparser downward
      const p = y < 230 ? .9 - edge * .55 : (x < 250 || x > 1350) ? .7 - top * .55 : .18;
      if (R() > p) continue;
      const reg = y < 230 ? 'top' : x < 250 ? 'left' : x > 1350 ? 'right' : 'bot';
      const c = cols[Math.floor(R() * 4)], rot = Math.round(R() * 180), k = R(), op = (.45 + R() * .45).toFixed(2);
      let s;
      if (k < .42) { const w = 16 + R() * 16, h = 7 + R() * 4; s = `<rect x="${f1(x - w / 2)}" y="${f1(y - h / 2)}" width="${f1(w)}" height="${f1(h)}" rx="2" transform="rotate(${rot} ${f1(x)} ${f1(y)})" style="fill:${c};opacity:${op}"/>`; }
      else if (k < .64) s = `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(4 + R() * 5)}" style="fill:${c};opacity:${op}"/>`;
      else if (k < .84) { const L = 16 + R() * 10; s = `<path d="M${f1(x - L)} ${f1(y)} q${f1(L / 2)} -${f1(L / 2.2)} ${f1(L)} 0 t${f1(L)} 0" transform="rotate(${rot} ${f1(x)} ${f1(y)})" style="fill:none;stroke:${c};stroke-width:4;stroke-linecap:round;opacity:${op}"/>`; }
      else { const r = 7 + R() * 7, i = r * .28; s = `<path d="M${f1(x)} ${f1(y - r)} L${f1(x + i)} ${f1(y - i)} L${f1(x + r)} ${f1(y)} L${f1(x + i)} ${f1(y + i)} L${f1(x)} ${f1(y + r)} L${f1(x - i)} ${f1(y + i)} L${f1(x - r)} ${f1(y)} L${f1(x - i)} ${f1(y - i)}Z" style="fill:${c};opacity:${op}"/>`; }
      out[reg] += s; n++;
    }
    /* two curled streamers in the top corners */
    const curl = (x, y, m, c) => `<path d="M${x} ${y} c${40 * m} 30 ${10 * m} 70 ${50 * m} 90 s${50 * m} -6 ${34 * m} 46 s-${16 * m} 34 ${10 * m} 54" style="fill:none;stroke:${c};stroke-width:5;stroke-linecap:round;opacity:.9"/>`;
    out.top += curl(380, -10, 1, 'var(--a2)') + curl(1250, -10, -1, 'var(--a1)');
    return layer(...regions.top, out.top, { an: 'aDrop', dur: 760, d: 0, ease: 'cubic-bezier(.2,.8,.3,1)' })
      + layer(...regions.left, out.left, { an: 'aDropS', dur: 760, d: 140 }) + layer(...regions.right, out.right, { an: 'aDropS', dur: 760, d: 180 })
      + layer(...regions.bot, out.bot, { an: 'aFade', dur: 700, d: 300 });

      for (let j = 0; j < 2 + k; j++) { const a = Math.PI * (.62 + R() * .7); const x = ox + r * Math.cos(a), y = oy + r * Math.sin(a);
        if (x < 1600 && y > 0 && y < 900) s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${k < 3 ? 7 : 5.5}" style="fill:color-mix(in srgb, var(--s-acc) ${Math.round(op * 100 + 20)}%, transparent)"/>`; }
      layers[Math.floor(k / 2)].push(s);
    });
    const core = `<circle cx="${ox}" cy="${oy}" r="96" style="fill:color-mix(in srgb, var(--s-acc) 26%, transparent)"/>`;
    const o = `${ox - 900}px ${oy - 0}px`;
    return layer(900, 0, 700, 900, core + layers[0].join(''), { an: 'aGrow', dur: 700, d: 0, o: '820px 560px' })
      + layer(900, 0, 700, 900, layers[1].join(''), { an: 'aGrow', dur: 700, d: 120, o: '820px 560px' })
      + layer(900, 0, 700, 900, layers[2].join(''), { an: 'aGrow', dur: 700, d: 240, o: '820px 560px' });
  },

  welcome() {
    const cx = 800, sy = 470, Ro = 432, Ri = 396;
    let wall = ''; for (let y = 60, r = 0; y < 900; y += 74, r++) {   // ashlar courses, very faint
      wall += `<path d="M0 ${y} H1600" style="stroke:var(--a2);stroke-width:2"/>`;
      for (let x = (r % 2) * 95; x < 1600; x += 190) wall += `<path d="M${x} ${y} V${y + 74}" style="stroke:var(--a2);stroke-width:2"/>`; }
    const arch = (R) => `M${cx - R} 900 V${sy} A${R} ${R} 0 0 1 ${cx + R} ${sy} V900`;
    let vous = ''; for (let a = 180; a <= 360; a += 12) { if (Math.abs(a - 270) < 7) continue; const t = a * Math.PI / 180;
      vous += `<path d="M${f1(cx + Ri * Math.cos(t))} ${f1(sy + Ri * Math.sin(t))} L${f1(cx + Ro * Math.cos(t))} ${f1(sy + Ro * Math.sin(t))}" style="stroke:color-mix(in srgb, var(--a1) 55%, transparent);stroke-width:2"/>`; }
    const k0 = 264 * Math.PI / 180, k1 = 276 * Math.PI / 180, kr0 = Ri - 6, kr1 = Ro + 14;
    const key = `<path d="M${f1(cx + kr0 * Math.cos(k0))} ${f1(sy + kr0 * Math.sin(k0))} L${f1(cx + kr1 * Math.cos(k0))} ${f1(sy + kr1 * Math.sin(k0))} L${f1(cx + kr1 * Math.cos(k1))} ${f1(sy + kr1 * Math.sin(k1))} L${f1(cx + kr0 * Math.cos(k1))} ${f1(sy + kr0 * Math.sin(k1))}Z" style="fill:color-mix(in srgb, var(--a1) 30%, var(--s-bg));stroke:var(--a1);stroke-width:2.5;stroke-linejoin:round"/>`;
    const door = `<path d="${arch(Ro)}Z" style="fill:var(--s-bg)"/><path d="${arch(Ri)}Z" style="fill:var(--sheet)"/>
      <path d="${arch(Ro)}" style="fill:none;stroke:var(--a1);stroke-width:3"/><path d="${arch(Ri)}" style="fill:none;stroke:color-mix(in srgb, var(--a1) 70%, transparent);stroke-width:2"/>${vous}${key}
      <path d="M${cx - Ro - 40} ${sy} H${cx - Ro} M${cx + Ro} ${sy} H${cx + Ro + 40}" style="stroke:var(--a1);stroke-width:3;stroke-linecap:round"/>`;
    return layer(0, 0, 1600, 900, wall, { an: 'aFade', dur: 700 }) + layer(cx - Ro - 50, sy - Ro - 20, 2 * Ro + 100, 900 - sy + Ro + 20, door, { an: 'aGrowS', dur: 900, d: 60, o: '50% 100%' });
  },

  simcha() {
    const string = (x0, y0, x1, y1, cxp, cyp, step, w, len, op, cols) => {
      const P = t => [(1 - t) ** 2 * x0 + 2 * (1 - t) * t * cxp + t * t * x1, (1 - t) ** 2 * y0 + 2 * (1 - t) * t * cyp + t * t * y1];
      let s = `<path d="M${x0} ${y0} Q${cxp} ${cyp} ${x1} ${y1}" style="fill:none;stroke:color-mix(in srgb, var(--s-ink) 40%, transparent);stroke-width:2"/>`;
      const N = Math.round((x1 - x0) / step);
      for (let i = 1; i < N; i++) { const t = i / N, [x, y] = P(t), [xa, ya] = P(t - .01), [xb, yb] = P(t + .01);
        const ang = Math.atan2(yb - ya, xb - xa), ux = Math.cos(ang), uy = Math.sin(ang), nx = -uy, ny = ux;
        const a = [x - ux * w / 2, y - uy * w / 2], b = [x + ux * w / 2, y + uy * w / 2], c = [x + nx * len, y + ny * len];
        s += `<path d="M${f1(a[0])} ${f1(a[1])} L${f1(b[0])} ${f1(b[1])} L${f1(c[0])} ${f1(c[1])}Z" style="fill:${cols[i % cols.length]};opacity:${op}"/>`; }
      return s;
    };
    const cols = ['var(--a1)', 'var(--a2)', 'var(--a3)', 'var(--a4)'];
    return layer(0, 0, 1600, 200, string(-30, -6, 1630, 6, 800, 150, 64, 40, 54, .5, [cols[2], cols[0], cols[3], cols[1]]), { an: 'aDrop', dur: 900, d: 0, ease: 'cubic-bezier(.2,1.25,.4,1)' })
      + layer(0, 0, 1600, 230, string(-30, 20, 1630, 34, 800, 240, 76, 52, 72, 1, cols), { an: 'aDrop', dur: 900, d: 120, ease: 'cubic-bezier(.2,1.25,.4,1)' });
  },

  schedule() {
    const cx = 280, cy = 470, r = 176;
    let face = `<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:color-mix(in srgb, var(--s-ink) 4%, transparent);stroke:var(--a1);stroke-width:3"/>`;
    for (let i = 0; i < 12; i++) { const a = i * 30 * Math.PI / 180, big = i % 3 === 0, r0 = r - (big ? 30 : 18);
      face += `<path d="M${f1(cx + r0 * Math.sin(a))} ${f1(cy - r0 * Math.cos(a))} L${f1(cx + (r - 10) * Math.sin(a))} ${f1(cy - (r - 10) * Math.cos(a))}" style="stroke:var(--a1);stroke-width:${big ? 5 : 3};stroke-linecap:round"/>`; }
    const hand = (deg, len, w, col, dash = '') => { const a = deg * Math.PI / 180; return `<path d="M${cx} ${cy} L${f1(cx + len * Math.sin(a))} ${f1(cy - len * Math.cos(a))}" style="stroke:${col};stroke-width:${w};stroke-linecap:round;${dash}"/>`; };
    face += hand(52.5, 92, 7, 'var(--a2)', 'stroke-dasharray:2 13') + hand(270, 136, 5, 'var(--a2)', 'stroke-dasharray:2 12');   // was 1:45, ghosted
    const R2 = r + 30;   // arc arrow: minute hand 270° → 90° (+30 min), clockwise over the top
    const arc = `<path d="M${cx - R2} ${cy} A${R2} ${R2} 0 0 1 ${cx + R2} ${cy}" style="fill:none;stroke:color-mix(in srgb, var(--s-acc) 70%, transparent);stroke-width:4;stroke-linecap:round"/>
      <path d="M${cx + R2 - 13} ${cy - 16} L${cx + R2} ${cy + 2} L${cx + R2 + 15} ${cy - 15}" style="fill:none;stroke:color-mix(in srgb, var(--s-acc) 70%, transparent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/>`;
    const L = (inner, an, d) => layer(cx - 220, cy - 220, 440, 440, inner, { an, dur: 900, d, o: '220px 220px', ease: 'cubic-bezier(.3,.7,.2,1)' });
    return layer(cx - 220, cy - 220, 440, 440, face) + layer(cx - 230, cy - 230, 460, 260, arc, { an: 'aFade', dur: 500, d: 600 })
      + L(hand(67.5, 92, 9, 'var(--s-acc)'), 'aTurnH', 150) + L(hand(90, 140, 6, 'var(--s-acc)') + `<circle cx="${cx}" cy="${cy}" r="11" style="fill:var(--s-acc)"/>`, 'aTurnM', 150);
  },

  quiet() { return ''; },

  chanukah() {
    const cx = 280, cupY = 420, sp = 44; let arms = '', cups = '', flames = [];
    const xs = [-4, -3, -2, -1, 1, 2, 3, 4].map(k => cx + k * sp);
    xs.forEach(x => { const d = Math.abs(x - cx); arms += `<path d="M${cx} ${cupY + 26 + d * 1.15} L${x} ${cupY + 14}" class="ln" style="stroke-width:5"/>`; });
    arms += `<path d="M${cx} ${cupY - 54} V790" class="ln" style="stroke-width:7"/><path d="M${cx - 64} 792 Q${cx} 744 ${cx + 64} 792Z" class="ln" style="fill:color-mix(in srgb, var(--a1) 24%, var(--s-bg));stroke-width:4"/>`;
    [...xs, cx].forEach((x, i) => { const y = i === 8 ? cupY - 68 : cupY;
      cups += `<rect x="${x - 15}" y="${y}" width="30" height="14" rx="3" style="fill:var(--a1)"/><rect x="${x - 6}" y="${y - 34}" width="12" height="34" rx="2" style="fill:var(--a4);stroke:color-mix(in srgb, var(--s-ink) 22%, transparent);stroke-width:1.5"/>`;
      flames.push([x, y - 38]); });
    let out = layer(80, 240, 400, 570, arms + cups) + layer(40, 120, 480, 420, glow('cg', cx, 360, 230, 'var(--a2)', .16), { an: 'aFade', dur: 800, d: 300 });
    /* shamash first, then the eight from right to left as they are kindled */
    const order = [8, 7, 6, 5, 4, 3, 2, 1, 0];
    order.forEach((idx, k) => { const [x, y] = flames[idx]; out += layer(x - 16, y - 46, 32, 50, flame(x, y, 40), { an: 'aFlame', dur: 300, d: 300 + k * 70, o: '50% 100%' }); });
    return out;
  },
};

  welcome:     { bigwords: { he: 'ברוכים הבאים', en: 'Welcome, parents of Shiur Gimmel', sub: ['Open shiur in the zal · Kiddush at 12:30', ''] } },
  simcha:      { bigwords: { he: 'יום הולדת שמח', en: 'Happy birthday, Levi Shapiro!', sub: ['A year of growth in Torah and Chassidus', 'שנת הצלחה'] } },
  schedule:    { quick: { kick: ['Today only', 'היום בלבד'], name: ['Mincha', 'מנחה'], times: [['2:15', 'PM']], was: '1:45 PM', where: ['In the zal', 'בזאל'] } },
  quiet:       { bigwords: { he: 'שקט, בבקשה', en: 'Quiet please — farher in the zal until 11:30' } },
  chanukah:    { event: { he: 'הדלקת נר חנוכה', en: 'Public Menorah Lighting', when: ['Tonight', 'הערב'], time: ['5:45', 'PM'], place: { en: 'Lincoln Road', en2: 'Bring a friend', he: 'בלינקולן רוד' } } },
};

/* ═════════════ LAYOUTS ═════════════ */
const T = (t, ap) => `${t}<small>${ap}</small>`;
const kick = k => k ? `<div class="kick" data-s style="--i:0">${k[0] ? `<span>${k[0]}</span>` : ''}${k[0] && k[1] ? '<i class="dot"></i>' : ''}${k[1] ? `<span class="he">${k[1]}</span>` : ''}</div>` : '';
const pair = (en, he) => `${en ? `<span>${en}</span>` : ''}${en && he ? '<i class="dot"></i>' : ''}${he ? `<span class="he">${he}</span>` : ''}`;
const LAYOUTS = {
  bigwords: m => `<div class="lyt bw">${kick(m.kick)}
    <div class="fit wrap w-he disp-he" data-max="300" data-s style="--i:1">${m.he}</div>
    <div class="fit wrap w-en" data-max="84" data-s style="--i:2">${m.en}</div>
    ${m.sub ? `<div class="sub" data-s style="--i:3">${pair(m.sub[0], m.sub[1])}</div>` : ''}</div>`,
  event: m => `<div class="lyt ev"><div class="titles">${kick(m.kick)}
      <div class="fit h-he disp-he" data-max="230" data-s style="--i:1">${m.he}</div>
      <div class="fit h-en disp-en" data-max="170" data-s style="--i:2">${m.en}</div></div>
    <div class="foot"><div class="tile" data-s style="--i:3"><div class="when"><div class="day">${m.when[0]}</div><div class="day he">${m.when[1]}</div></div><div class="t num">${T(...m.time)}</div></div>
      <div class="place" data-s style="--i:4"><div class="en">${m.place.en}</div>${m.place.en2 ? `<div class="en2">${m.place.en2}</div>` : ''}${m.place.he ? `<div class="he">${m.place.he}</div>` : ''}</div></div></div>`,
  list: m => `<div class="lyt ls"><div class="hd" data-s style="--i:0"><span class="en disp-en">${m.hd[0]}</span><span class="he disp-he">${m.hd[1]}</span></div>
    <div class="items">${m.items.map(([d, en, he, t, soon], i) => { const [tt, ap] = t.split(' ');
      return `<div class="li ${m.nod ? 'nod' : ''} ${soon ? 'soon' : ''}" data-s style="--i:${i + 1}">${m.nod ? '' : `<span class="d ${soon ? 'soon' : ''}">${d}</span>`}<span class="x">${en}<span class="he">${he}</span></span><span class="tm num">${tt}<small>${ap}</small></span></div>`; }).join('')}</div></div>`,
  quick: m => {
    const name = `<div class="nm" data-s style="--i:1"><span class="he disp-he">${m.name[1]}</span><span class="en disp-en">${m.name[0]}</span></div>`;
    let mid;
    if (m.big) mid = `<div class="fit big num" data-max="330" data-s style="--i:2">${m.big[0]}<small>${m.big[1]}</small></div>`;
    else if (m.times.length > 1) mid = `<div class="times">${m.times.map(([t, ap, en, he], i) => `<div class="tcol" data-s style="--i:${i + 2}"><div class="lab"><span class="he">${he}</span><span class="en">${en}</span></div><div class="t num">${T(t, ap)}</div></div>`).join('')}</div>`;
    else mid = `<div class="fit big num" data-max="330" data-s style="--i:2">${m.pre ? `<span class="pre">${m.pre}</span>` : ''}${T(...m.times[0])}</div>`;
    const was = m.was ? `<div class="was" data-s style="--i:3"><span>was</span><s class="num">${m.was}</s></div>` : '';
    return `<div class="lyt qt">${kick(m.kick)}${name}${mid}${was}${m.where ? `<div class="where" data-s style="--i:4">${pair(m.where[0], m.where[1])}</div>` : ''}</div>`;
  },
  quote: m => `<div class="lyt qq"><div class="fit wrap q-he" data-max="150" data-s style="--i:1">${m.he}</div>
    <div class="fit wrap q-en" data-max="64" data-s style="--i:2">${m.en}</div><div class="rule" data-s style="--i:3"></div>
    <div class="attr" data-s style="--i:4">${pair(m.attr[0], m.attr[1])}</div></div>`,
  sicha: m => `<div class="lyt sc"><div class="hd" data-s style="--i:0"><span class="en">${m.title[0]}</span><span class="he">${m.title[1]}</span></div>
    <div class="body paged" data-s style="--i:1" data-text="${m.body.replace(/"/g, '&quot;')}"></div>
    <div class="ft" data-s style="--i:2"><span>${m.source}</span><span class="pg"></span></div></div>`,
  letter: m => `<div class="lyt lt"><div class="top" data-s style="--i:0">${m.top}</div><div class="sal" data-s style="--i:1">${m.sal}</div>
    <div class="body paged" data-s style="--i:2" data-text="${m.body}"></div><div class="close" data-s style="--i:3">${m.close}</div>
    <div class="ft" data-s style="--i:4"><span style="display:flex;gap:28px;align-items:center">${m.source[0]}<span class="pg"></span></span><span class="he" style="font-family:var(--f-th-he)">${m.source[1]}</span></div></div>`,
};

/* ═════════════ RENDER ═════════════ */
function render() {
  const S = STY[P.style] || STY.classic, layout = P.layout || S.layout;
  const m = (SAMPLES[P.style] || {})[layout] || GENERIC[layout];
  const [L, R, Tp, B] = S.box, W = 1600 - L - R;
  const ch = { top: 34, side: 56, bottom: 34, ...(S.chrome || {}) };
  const pos = p => ({ tl: `top:${ch.top}px;left:${ch.side}px`, tr: `top:${ch.top}px;right:${ch.side}px`, bl: `bottom:${ch.bottom}px;left:${ch.side}px`, br: `bottom:${ch.bottom}px;right:${ch.side}px` }[p]);
  const clock = `<div class="chrome num" style="${pos(S.clock || 'tl')}">12:41 PM</div>`;
  const bh = (S.bh || 'tr') === 'none' ? '' : `<div class="chrome bh" style="${pos(S.bh || 'tr')}">ב״ה</div>`;
  document.getElementById('app').innerHTML = `<div class="stage st-${P.style} ${S.align} mo-${S.motion} ${W < 1000 ? 'narrow' : ''} ${P.enter ? 'enter' : ''}">
    <div class="art stage-in">${ART[P.style] ? ART[P.style]() : ''}</div>${clock}${bh}
    <div class="box" style="left:${L}px;right:${R}px;top:${Tp}px;bottom:${B}px">${LAYOUTS[layout](m)}</div></div>`;
  if (W < 1000) document.querySelector('.stage').style.setProperty('--tile-size', '112px');
  fitAll();
}

/* one-shot auto-fit (binary search), never per frame */
function fitAll() {
  document.querySelectorAll('.fit').forEach(el => el.style.height = '');
  document.querySelectorAll('.fit').forEach(el => {
    let lo = 16, hi = +el.dataset.max || 200;
    if (el.classList.contains('disp-he') || el.classList.contains('q-he')) hi = Math.round(hi * (+getComputedStyle(document.documentElement).getPropertyValue('--he-scale') || 1));
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; el.style.fontSize = mid + 'px';
      (el.scrollWidth <= el.clientWidth + 1 && el.scrollHeight <= el.clientHeight + 2) ? lo = mid : hi = mid; }
    el.style.fontSize = lo + 'px';
  });
  document.querySelectorAll('.fit').forEach(el => el.style.height = 'auto');
  document.querySelectorAll('.qt .nm').forEach(el => { let k = 1; el.style.setProperty('--k', k); const W = el.parentElement.clientWidth;
    while (el.scrollWidth > W + 1 && k > .4) { k -= .02; el.style.setProperty('--k', k.toFixed(2)); } });
  /* two-time quick layout: one size for both times, fitted to the narrower column */
  const ts = [...document.querySelectorAll('.qt .tcol .t')];
  if (ts.length) { let s = 170; const ok = () => ts.every(t => t.scrollWidth <= t.parentElement.clientWidth - (parseFloat(getComputedStyle(t.parentElement).paddingLeft) + parseFloat(getComputedStyle(t.parentElement).paddingRight)) + 1);
    ts.forEach(t => t.style.display = 'inline-block'); do { ts.forEach(t => t.style.fontSize = s + 'px'); s -= 4; } while (!ok() && s > 60); ts.forEach(t => t.style.display = ''); }
  /* pagination at fixed reading size (from R2) */
  document.querySelectorAll('.paged').forEach(el => {
    const paras = el.dataset.text.split('|'); const words = paras.map((p, i) => p.split(' ').map((w, j) => ({ w, br: j === 0 && i > 0 }))).flat();
    const build = arr => '<p>' + arr.map((x, k) => (x.br && k > 0 ? '</p><p>' : '') + x.w).join(' ').replace(/<p> /g, '<p>') + '</p>';
    const pages = []; let i = 0;
    while (i < words.length) {
      let j = i + 1; el.innerHTML = build(words.slice(i, j));
      while (j < words.length) { el.innerHTML = build(words.slice(i, j + 1)); if (el.scrollHeight > el.clientHeight + 1) break; j++; }
      if (j < words.length) { let k = j; while (k > i && !words[k].br) k--; if (k > i && (k - i) >= (j - i) * .6) j = k;
        else { k = j; while (k > i + 20 && !/[.!?”:]$/.test(words[k - 1].w)) k--; if (k > i + 20) j = k; } }
      pages.push(words.slice(i, j)); i = j;
    }
    const cur = Math.min(P.pg, pages.length) - 1; el.innerHTML = build(pages[cur]);
    const pg = el.closest('.lyt').querySelector('.pg');
    if (pg) pg.innerHTML = pages.length < 2 ? '' : `<span class="num">${cur + 1} / ${pages.length}</span>` + pages.map((_, k) => `<i class="${k === cur ? 'on' : ''}"></i>`).join('');
  });
}

render();
const fams = [F.heDisp, F.he, F.enDisp, F.en, F.thHe, F.thEn].map(f => f.split(',')[0]);
Promise.all(fams.flatMap(f => ['400', '600', '700'].map(w => document.fonts.load(`${w} 40px ${f}`, 'אבג Ab12')))).catch(() => {}).then(() => document.fonts.ready).then(() => {
  fitAll();
  if (P.t != null) document.getAnimations().forEach(a => { a.pause(); a.currentTime = +P.t; });   // scrub the entrance: ?enter=1&t=400
  window.__ready = true;
});
</script>
