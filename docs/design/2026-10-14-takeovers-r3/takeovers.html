<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TachTach Takeovers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Rubik:wght@400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'FbMazalMedium';       src: url('fonts/639a27fb-e8a2-4ecd-9bd9-1ec66b07e521.ttf') format('truetype'); }
@font-face { font-family: 'LiaShaharit Regular 1'; src: url('fonts/335be0ec-dc21-409c-bbc8-e10972958e94.ttf') format('truetype'); }
@font-face { font-family: '1ShefaClassic';       src: url('fonts/1878d33d-34ff-495a-8a4a-7522a59e4b9a.ttf') format('truetype'); }
@font-face { font-family: 'BAWSVenezia Regular'; src: url('fonts/6a5c0f34-1ccc-45f6-9775-0f65cd3526c4.ttf') format('truetype'); }
@font-face { font-family: 'LiaHalel Regular';    src: url('fonts/0307dc9e-66e5-4fe7-88fd-19af31186c21.ttf') format('truetype'); }

/* ═════════════ TachTach takeovers · round 3b ═════════════
   BASE ROLES = R2 tokens (--bg --text --dim --muted --accent --onAccent --lift --liftPct).
   A STYLE overrides STAGE ROLES only, derived with color-mix():
     --s-bg --s-ink --s-dim --s-acc --s-onacc --s-accText --s-fill --s-fillInk --s-line --sheet --a1..--a4
   FONT ROLES only: --f-he-disp --f-he --f-en-disp --f-en --f-num --f-th-he --f-th-en (+ --he-scale).
   MOTION (owner decision, round 3b): a crafted ENTRANCE (≤1.2 s) + a gentle AMBIENT LOOP, takeovers only.
     Only transform + opacity are ever animated; every moving thing is its own small layer (.lp);
     no filter/blur/backdrop-filter/blend/box-shadow animation. Setting: anim = full | entrance | off. */

@property --bg      { syntax: '<color>'; inherits: true; initial-value: #000; }
@property --text    { syntax: '<color>'; inherits: true; initial-value: #fff; }
@property --dim     { syntax: '<color>'; inherits: true; initial-value: #aaa; }
@property --muted   { syntax: '<color>'; inherits: true; initial-value: #666; }
@property --accent  { syntax: '<color>'; inherits: true; initial-value: #888; }
@property --onAccent{ syntax: '<color>'; inherits: true; initial-value: #000; }
@property --lift    { syntax: '<color>'; inherits: true; initial-value: #fff; }
@property --liftPct { syntax: '<percentage>'; inherits: true; initial-value: 6%; }
:root { --raised: color-mix(in srgb, var(--lift) var(--liftPct), var(--bg)); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); overflow: hidden; }
body { color: var(--text); font-family: var(--f-en); -webkit-font-smoothing: antialiased; }
.he { direction: rtl; font-family: var(--f-he); font-synthesis: none; }
.num { font-family: var(--f-big); font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum" 1, "tnum" 1; }

.stage {
  --s-bg: var(--bg); --s-ink: var(--text); --s-dim: var(--dim);
  --s-acc: var(--accent); --s-onacc: var(--onAccent); --s-accText: var(--s-acc);
  --s-fill: var(--s-acc); --s-fillInk: var(--s-onacc);
  --s-line: color-mix(in srgb, var(--s-ink) 16%, transparent);
  --a1: var(--s-acc); --a2: var(--s-acc); --a3: var(--s-acc); --a4: var(--s-acc);
  --sheet: var(--raised);
  --f-disp-he: var(--f-he-disp); --f-disp-en: var(--f-en-disp); --f-big: var(--f-num);
  --disp-w: 700; --en-w: 600; --tile-w: 700; --qt-w: 300; --en-track: -.03em;
  position: relative; overflow: hidden; background: var(--s-bg); color: var(--s-ink);
}
.light .stage { --s-dim: color-mix(in srgb, var(--s-ink) 74%, transparent); }
.art { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.lay { position: absolute; }
.lp { position: absolute; inset: 0; }
.lay svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chrome { position: absolute; z-index: 4; font-size: 28px; font-weight: 600; color: var(--s-dim); line-height: 1; }
.chrome.bh { font-family: var(--f-he); font-size: calc(30px * var(--he-scale)); font-weight: 500; direction: rtl; }
.box { position: absolute; z-index: 3; }
.box > .lyt { position: absolute; inset: 0; }
.ln { fill: none; stroke: var(--a1); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

/* ── type helpers ── */
.fit { overflow: hidden; line-height: 1.14; }
.fit.wrap { white-space: normal; text-wrap: balance; }
.fit.nw { white-space: nowrap; }
.disp-he { font-family: var(--f-disp-he); font-weight: var(--disp-w); direction: rtl; font-synthesis: none; }
.disp-en { font-family: var(--f-disp-en); font-weight: var(--disp-w); letter-spacing: var(--en-track); }
.kick { font-size: 34px; font-weight: 600; color: var(--s-accText); display: flex; gap: 22px; align-items: baseline; margin-bottom: 10px; white-space: nowrap; }
.kick .he { font-size: 1.06em; font-weight: 600; }
.center .kick { justify-content: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--s-line); display: inline-block; align-self: center; flex: none; }
.w, .dg { display: inline-block; }

/* ── LAYOUT: big words ── */
.bw { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.start .bw { align-items: flex-start; text-align: left; }
.bw .w-he { height: 44%; width: 100%; color: var(--s-accText); text-align: center; line-height: 1.12; }
.start .bw .w-he { text-align: left; }
.bw .w-en { height: 26%; width: 96%; font-weight: var(--en-w); letter-spacing: -.02em; margin-top: 10px; line-height: 1.16; font-family: var(--f-disp-en); text-align: center; }
.start .bw .w-en { width: 100%; text-align: left; }
.bw .sub { margin-top: 24px; width: 100%; max-height: 110px; font-size: 32px; color: var(--s-dim); font-weight: 500; text-align: center; line-height: 1.3; }
.start .bw .sub { text-align: left; }
.bw .sub .he { font-size: 1.06em; }

/* ── LAYOUT: event card ── */
.ev { display: flex; flex-direction: column; }
.ev .titles { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.ev .h-he { height: 54%; text-align: left; }
.ev .h-en { height: 38%; }
.center .ev .titles { align-items: center; text-align: center; } .center .ev .h-he { text-align: center; width: 100%; } .center .ev .h-en { width: 100%; }
.ev .foot { flex: none; display: flex; align-items: center; gap: 44px; }
.center .ev .foot { justify-content: center; }
.narrow .ev .foot { flex-direction: column; align-items: flex-start; gap: 18px; } .center.narrow .ev .foot { align-items: center; }
.tile { background: var(--s-fill); color: var(--s-fillInk); border-radius: 30px; padding: 22px 40px 26px; display: flex; align-items: center; gap: 34px; flex: none; }
.tile .day { font-size: 38px; font-weight: 600; line-height: 1.15; white-space: nowrap; }
.tile .day.he { font-size: calc(32px * var(--he-scale)); font-weight: 500; color: color-mix(in srgb, currentColor 80%, transparent); }
.tile .t { font-size: var(--tile-size, 140px); font-weight: var(--tile-w); letter-spacing: -.05em; line-height: .9; white-space: nowrap; }
.tile .t small { font-size: max(20px, .28em); letter-spacing: 0; font-weight: 600; margin-left: 10px; color: color-mix(in srgb, currentColor 78%, transparent); }
.tile.only .when { display: none; }
.tile.stackt { flex-direction: column; align-items: flex-start; gap: 6px; padding: 18px 32px 22px; }
.tile.stackt .when { display: flex; gap: 16px; align-items: baseline; }
.place { min-width: 0; max-width: 100%; }
.place .en { font-size: calc(42px * var(--k, 1)); font-weight: 600; line-height: 1.15; }
.place .en2 { font-size: calc(30px * var(--k, 1)); color: var(--s-dim); font-weight: 500; margin-top: 4px; line-height: 1.2; }
.place .he { font-size: calc(34px * var(--he-scale) * var(--k, 1)); color: var(--s-dim); text-align: left; margin-top: 6px; line-height: 1.2; }
.center .place .he, .center .place { text-align: center; }

/* ── LAYOUT: list ── */
.ls { display: flex; flex-direction: column; }
.ls .hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; margin-bottom: 20px; }
.ls .hd .en { flex: 1 1 56%; min-width: 0; line-height: 1.15; }
.ls .hd .he { flex: 0 1 38%; min-width: 0; line-height: 1.15; color: var(--s-accText); text-align: left; }
.ls .items { flex: 1; display: grid; grid-auto-rows: minmax(0, 1fr); min-height: 0; }
.li { display: grid; grid-template-columns: 210px 1fr auto; align-items: center; column-gap: 28px; border-top: 2px solid var(--s-line); min-height: 0; overflow: hidden; }
.li.nod { grid-template-columns: 1fr auto; }
.li .d { font-size: 32px; font-weight: 600; color: var(--s-dim); line-height: 1.15; }
.li .d.soon, .li.soon .tm { color: var(--s-accText); }
.li .x { font-size: calc(var(--lf, 42) * 1px); font-weight: 600; line-height: 1.16; letter-spacing: -.01em; min-width: 0; }
.li .x .he { display: block; font-size: max(20px, calc(var(--lf, 42) * .78px * var(--he-scale))); font-weight: 500; color: var(--s-dim); text-align: left; margin-top: 2px; }
.li .tm { font-size: calc(var(--lf, 42) * 1.28px); font-weight: 650; letter-spacing: -.035em; white-space: nowrap; }
.li .tm small { font-size: 20px; font-weight: 600; letter-spacing: 0; margin-left: 6px; color: var(--s-dim); }
.narrow .li { grid-template-columns: 150px 1fr auto; column-gap: 20px; } .narrow .li .d { font-size: 25px; }

/* ── LAYOUT: quick time ── */
.qt { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.start .qt { align-items: flex-start; text-align: left; }
.qt .nm { display: flex; align-items: baseline; gap: calc(34px * var(--k, 1)); max-width: 100%; white-space: nowrap; }
.qt .nm.stack { flex-direction: column; align-items: inherit; gap: 0; white-space: nowrap; }
.lyt > *, .qt > *, .ev > *, .bw > *, .qq > * { flex-shrink: 0; }
.ev > .titles { flex-shrink: 1; }
.qt .nm .he { font-size: calc(90px * var(--he-scale) * var(--k, 1)); line-height: 1.1; }
.qt .nm .en { font-size: calc(78px * var(--k, 1)); line-height: 1.1; }
.pw { width: 100%; height: 42%; }
.qt .big { height: 100%; width: 100%; font-weight: var(--qt-w); letter-spacing: -.06em; line-height: 1; color: var(--s-accText); text-align: inherit; }
.qt .big small { font-size: .22em; font-weight: 500; letter-spacing: 0; margin-left: .18em; color: inherit; }
.qt .big .pre { font-size: .2em; font-weight: 500; letter-spacing: 0; margin-right: .25em; color: var(--s-dim); }
.qt .was { font-size: 34px; color: var(--s-dim); font-weight: 500; margin-top: -4px; display: flex; gap: 14px; align-items: baseline; }
.qt .was s { text-decoration-thickness: 3px; color: var(--s-dim); }
.qt .where { font-size: 36px; color: var(--s-dim); font-weight: 500; margin-top: 18px; max-width: 100%; line-height: 1.25; text-align: inherit; }
.qt .where .he { font-size: 1.04em; }
.times { display: flex; width: 100%; margin: 28px 0 6px; }
.port .times { flex-direction: column; gap: 14px; }
.tcol { flex: 1; min-width: 0; padding: 4px 44px 0; }
.start .tcol:first-child { padding-left: 0; }
.tcol + .tcol { border-left: 2px solid var(--s-line); }
.port .tcol { padding: 0; } .port .tcol + .tcol { border-left: 0; border-top: 2px solid var(--s-line); padding-top: 14px; }
.tcol .lab { display: flex; flex-direction: column; gap: 4px; }
.start .tcol .lab { align-items: flex-start; } .center .tcol .lab { align-items: center; }
.tcol .lab .he { font-size: calc(40px * var(--he-scale)); font-weight: 600; }
.tcol .lab .en { font-size: 28px; color: var(--s-dim); font-weight: 500; }
.tcol .t { font-size: var(--t2-size, 150px); font-weight: var(--qt-w); letter-spacing: -.055em; line-height: 1; margin-top: 10px; color: var(--s-accText); white-space: nowrap; }
.tcol .t small { font-size: .26em; font-weight: 500; letter-spacing: 0; margin-left: .16em; }

/* ── LAYOUT: inspiration ── */
.qq { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.qq .q-he { width: 94%; height: 42%; font-family: var(--f-th-he); font-weight: 500; direction: rtl; text-align: center; line-height: 1.22; }
.qq .q-en { width: 86%; height: 22%; font-family: var(--f-th-en); font-style: italic; font-weight: 400; color: var(--s-dim); line-height: 1.25; margin-top: 18px; text-align: center; }
.qq .rule { width: 72px; height: 3px; border-radius: 2px; background: var(--s-accText); margin: 30px 0 22px; flex: none; }
.qq .attr { font-size: 30px; color: var(--s-dim); font-weight: 500; max-width: 100%; text-align: center; }
.qq .attr .he { font-family: var(--f-th-he); font-size: 1.06em; }
.sc { display: flex; flex-direction: column; }
.port .hd > * { flex: 0 0 auto !important; }
.port .hd { flex-direction: column; align-items: stretch !important; gap: 6px !important; }
.sc .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding-bottom: 20px; border-bottom: 2px solid var(--s-line); }
.sc .hd .en { flex: 1 1 58%; min-width: 0; font-family: var(--f-th-en); font-weight: 600; letter-spacing: -.01em; }
.sc .hd .he { flex: 0 1 38%; min-width: 0; font-family: var(--f-th-he); font-weight: 500; color: var(--s-accText); text-align: left; }
.sc .body { flex: 1; min-height: 0; overflow: hidden; margin-top: 26px; font-family: var(--f-th-en); font-size: 38px; line-height: 1.5; font-weight: 400; text-wrap: pretty; }
.sc .body p + p { margin-top: .6em; }
.ft { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 16px; font-size: 26px; color: var(--s-dim); font-weight: 500; }
.ft > span:first-child { min-width: 0; }
.ft .pg { display: flex; align-items: center; gap: 14px; flex: none; }
.ft .pg i { width: 34px; height: 5px; border-radius: 3px; background: var(--s-line); }
.ft .pg i.on { background: var(--s-accText); }
.lt { display: flex; flex-direction: column; direction: rtl; }
.lt .top { font-family: var(--f-th-he); color: var(--s-dim); font-size: calc(28px * var(--he-scale)); line-height: 1.4; }
.lt .sal { font-family: var(--f-th-he); font-size: calc(42px * var(--he-scale)); font-weight: 700; margin: 14px 0 8px; color: var(--s-accText); }
.lt .body { flex: 1; min-height: 0; overflow: hidden; font-family: var(--f-th-he); font-size: calc(35px * var(--he-scale)); line-height: 1.6; text-align: right; text-wrap: pretty; }
.lt .close { font-family: var(--f-th-he); font-size: calc(36px * var(--he-scale)); font-weight: 700; text-align: left; margin-top: 20px; }
.lt .ft { direction: ltr; }

/* ═════════════ STYLES ═════════════ */
.st-classic .panelbg { position: absolute; inset: 28px; border-radius: 40px; background: var(--raised); z-index: 0; }
.light .st-classic { --s-fill: color-mix(in srgb, var(--s-acc) 88%, #000); }

.st-grand { --s-bg: color-mix(in srgb, #000 26%, var(--bg)); --s-acc: #D6AF5C; --s-onacc: #1A1408;
  --f-disp-he: var(--f-th-he); --f-disp-en: var(--f-th-en); --f-big: var(--f-th-en); --disp-w: 600; --en-w: 600; --tile-w: 500; --en-track: -.01em; }
.light .st-grand { --s-bg: color-mix(in srgb, #FFF 50%, var(--bg)); --s-acc: #87631A; --s-onacc: #FFF; }
.st-grand .tile { box-shadow: 0 0 0 2px var(--s-bg), 0 0 0 4px color-mix(in srgb, var(--s-acc) 60%, transparent); border-radius: 6px; }

.st-emergency { --s-bg: #A3170F; --s-ink: #FFFFFF; --s-dim: rgba(255,255,255,.92); --s-acc: #FFFFFF; --s-onacc: #A3170F;
  --s-line: rgba(255,255,255,.32); --a1: #FFFFFF; --a2: rgba(0,0,0,.30); --disp-w: 800; }
.light .st-emergency { --s-bg: #A91F17; --s-onacc: #A91F17; --s-dim: rgba(255,255,255,.92); --a2: rgba(255,255,255,.26); }

.st-sleek { --s-acc: var(--s-ink); --s-onacc: var(--s-bg); --s-accText: var(--s-ink); --a1: color-mix(in srgb, var(--s-ink) 42%, transparent);
  --a2: color-mix(in srgb, var(--s-ink) 20%, transparent); --disp-w: 500; --tile-w: 300; --qt-w: 200; }
.st-sleek .tile { background: transparent; color: var(--s-ink); box-shadow: inset 0 0 0 2px var(--s-line); }

.st-celebration { --s-bg: color-mix(in srgb, #2A0E22 74%, var(--bg)); --s-ink: color-mix(in srgb, #FFF4E6 78%, var(--text));
  --s-dim: color-mix(in srgb, var(--s-ink) 70%, transparent); --s-acc: #EDBE5E; --s-onacc: #2A0E22;
  --a1: #EDBE5E; --a2: #E68C9F; --a3: #6CC7B8; --a4: #F4E7CC; --disp-w: 800; }
.light .st-celebration { --s-bg: color-mix(in srgb, #FFF8EC 66%, var(--bg)); --s-ink: color-mix(in srgb, #3A1026 72%, var(--text));
  --s-acc: #A8325A; --s-onacc: #FFF; --a1: #D9A23A; --a2: #C9486F; --a3: #2F9A8C; --a4: #6E8FD6; }

.st-urgent { --s-acc: #F2A33A; --s-onacc: #1E1405; --s-bg: color-mix(in srgb, #F2A33A 7%, var(--bg)); }
.light .st-urgent { --s-acc: #B05C08; --s-onacc: #FFF; --s-bg: color-mix(in srgb, #F2A33A 9%, color-mix(in srgb, #FFF 40%, var(--bg))); }

.st-torah { --s-bg: color-mix(in srgb, #C9A46A 7%, var(--bg)); --sheet: color-mix(in srgb, #C9A46A 13%, var(--raised));
  --s-acc: #CFA155; --s-onacc: #1C1206; --a1: #CFA155; --a2: color-mix(in srgb, #CFA155 30%, var(--s-bg));
  --f-disp-he: var(--f-th-he); --f-disp-en: var(--f-th-en); --disp-w: 600; --en-w: 600; --en-track: -.01em; }
.light .st-torah { --s-bg: color-mix(in srgb, #C9A46A 30%, var(--bg)); --sheet: color-mix(in srgb, #FBF1DA 80%, #FFF);
  --s-acc: #7A5520; --s-onacc: #FFF; --a1: #8E6A2E; --a2: color-mix(in srgb, #C9A46A 45%, #FFF); }

.st-trip { --s-acc: #5BBCD0; --s-onacc: #06181C; --s-bg: color-mix(in srgb, #5BBCD0 7%, var(--bg)); }
.light .st-trip { --s-acc: #156E7E; --s-onacc: #FFF; --s-bg: color-mix(in srgb, #5BBCD0 9%, color-mix(in srgb, #FFF 40%, var(--bg))); }

.st-phone { --s-acc: #A3AEFF; --s-onacc: #0B0F2A; --s-bg: color-mix(in srgb, #7D8BFF 7%, var(--bg)); --tile-w: 600; }
.light .st-phone { --s-acc: #3E4CC0; --s-onacc: #FFF; --s-bg: color-mix(in srgb, #7D8BFF 8%, color-mix(in srgb, #FFF 40%, var(--bg))); }
.st-phone .tile { background: transparent; color: var(--s-acc); box-shadow: inset 0 0 0 4px var(--s-acc); }

.st-memorial { --s-bg: color-mix(in srgb, #000 42%, var(--bg)); --s-ink: color-mix(in srgb, var(--text) 86%, var(--s-bg));
  --s-dim: color-mix(in srgb, var(--s-ink) 64%, transparent); --s-acc: var(--s-ink); --s-onacc: var(--s-bg); --s-accText: var(--s-ink);
  --a1: color-mix(in srgb, var(--s-ink) 46%, transparent); --a2: #EDB566; --a3: #FFF0CC;
  --f-disp-he: var(--f-th-he); --f-disp-en: var(--f-th-en); --f-big: var(--f-th-en); --disp-w: 500; --en-w: 500; --tile-w: 400; --qt-w: 400; --en-track: -.005em; }
.light .st-memorial { --s-bg: color-mix(in srgb, var(--text) 6%, color-mix(in srgb, #FFF 30%, var(--bg))); --s-ink: var(--text);
  --a1: color-mix(in srgb, var(--s-ink) 52%, transparent); --a2: #D48A24; --a3: #FFF6DE; }
.st-memorial .tile { background: transparent; color: var(--s-ink); box-shadow: inset 0 0 0 2px var(--s-line); }

.st-hype { --s-acc: #FF6A45; --s-onacc: #1A0904; --s-bg: color-mix(in srgb, #FF5B3A 8%, var(--bg)); --disp-w: 800; --qt-w: 800; }
.light .st-hype { --s-acc: #D23A1A; --s-onacc: #FFF; --s-bg: color-mix(in srgb, #FF5B3A 6%, color-mix(in srgb, #FFF 45%, var(--bg))); }

.st-shabbos { --s-bg: color-mix(in srgb, #0A1536 74%, var(--bg)); --s-ink: color-mix(in srgb, #F6EFE2 72%, var(--text));
  --s-dim: color-mix(in srgb, var(--s-ink) 68%, transparent); --s-acc: #F2C46A; --s-onacc: #0A1536;
  --a1: color-mix(in srgb, var(--s-ink) 52%, transparent); --a2: #F6C35E; --a3: #FFF4D6; --a4: #F3EEE4;

const q = new URLSearchParams(location.search);

const F = { ...(FONTSETS[P.fonts] || FONTSETS.default) };

/* ── canvas: land 1600x900 · 16x10 = 1600x1000 · port 900x1600 ── */
const CANVAS = { land: [1600, 900], '16x10': [1600, 1000], port: [900, 1600] }[P.canvas] || [1600, 900];

/* ── tiny helpers ── */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let MAP = { s: 1, ox: 0, oy: 0 }; const ID = { s: 1, ox: 0, oy: 0 };
let SIDE = ID, ARTRECTS = [], UID = 0;
const side = fn => { const p = MAP; MAP = SIDE; const r = fn(); MAP = p; return r; };
/* a layer = a bbox-sized div holding SVG in stage coordinates.

function layer(x, y, w, h, inner, a = null, lp = null) {
  const m = MAP, X = m.ox + x * m.s, Y = m.oy + y * m.s, Wd = w * m.s, Ht = h * m.s;
  const ea = a ? ` data-a style="left:${f1(X)}px;top:${f1(Y)}px;width:${f1(Wd)}px;height:${f1(Ht)}px;--an:${a.an};--dur:${a.dur || 700}ms;--d:${a.d || 0}ms;${a.ease ? `--ease:${a.ease};` : ''}transform-origin:${a.o || '50% 50%'}"`

    <path d="M${cx} ${by - h * .55} C${cx + w * .26} ${by - h * .36} ${cx + w * .28} ${by - h * .14} ${cx + w * .14} ${by - h * .05} C${cx + w * .06} ${by} ${cx - w * .06} ${by} ${cx - w * .14} ${by - h * .05} C${cx - w * .28} ${by - h * .14} ${cx - w * .26} ${by - h * .36} ${cx} ${by - h * .55}Z" style="fill:${inner}"/>`;

const glow = (cx, cy, r, col, a) => { const id = 'g' + (++UID); return `<defs><radialGradient id="${id}"><stop offset="0" style="stop-color:${col};stop-opacity:${a}"/><stop offset=".45" style="stop-color:${col};stop-opacity:${a * .38}"/><stop offset="1" style="stop-color:${col};stop-opacity:0"/></radialGradient></defs><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})"/>`; };

/* confetti-like scatter: static top garland + two falling strips on each side (period = H, seamless) */
function rain(G, seed, make, { nTop = 30, nCol = 12, cols = 4 }) {

    if (y < 96 && (x < 330 || x > W - 330)) continue;

  out += layer(0, 0, W, H * .26, top.join(''), { an: 'aDrop', dur: 760, d: 0, ease: 'cubic-bezier(.2,.8,.3,1)' });
  /* strips: left [0, bl-pad], right [br+pad, W]; two speeds each. Pieces are duplicated one period below so the loop has no seam. */
  const strips = [[0, Math.max(60, bl - pad)], [Math.min(W - 60, br + pad), W]];
  strips.forEach(([x0, x1], si) => [0, 1].forEach(k => {
    const pcs = []; const RR = rng(seed + si * 31 + k * 7);
    for (let i = 0; i < nCol; i++) { const x = x0 + 14 + RR() * (x1 - x0 - 28), y = RR() * H; if (y < 96 && (x < 330 || x > W - 330)) { i--; continue; } pcs.push([x, y, RR]); }
    const mk = (dy) => pcs.map(([x, y, r2]) => make(rng(Math.round(x * 7 + y)), x, y + dy, cols)).join('');
    out += layer(x0, -H, x1 - x0, 2 * H, mk(0) + mk(-H), { an: 'aFade', dur: 700, d: 160 + k * 100 },
      { k: 'kFall', d: k ? 46 : 70, e: 'linear', dir: 'normal', dl: -(si * 11 + k * 23), vars: { fy: H } });

}
const pieceConfetti = (R, x, y, cols) => {

  if (k < .84) { const L = 16 + R() * 10; return `<path d="M${f1(x - L)} ${f1(y)} q${f1(L / 2)} -${f1(L / 2.2)} ${f1(L)} 0 t${f1(L)} 0" transform="rotate(${rot} ${f1(x)} ${f1(y)})" style="fill:none;stroke:${c};stroke-width:4;stroke-linecap:round;opacity:${op}"/>`; }

/* ═════════════ ART — one function per style; returns layers.  G = {W,H,port,box:[l,t,r,b],light} ═════════════ */

  classic(G) {

  grand(G) {

      <circle cx="${W / 2 - 70}" cy="${y}" r="2.6" style="fill:var(--s-acc)"/><circle cx="${W / 2 + 70}" cy="${y}" r="2.6" style="fill:var(--s-acc)"/>`;

    let o = layer(0, 0, W, H, frame, { an: 'aGrowS', dur: 900, d: 0 });
    [[46, 46], [W - 46, 46], [46, H - 46], [W - 46, H - 46], [W / 2, 40], [W / 2, H - 40]].forEach(([x, y], i) =>
      o += layer(x - 14, y - 14, 28, 28, dia(x, y, i > 3 ? 9 : 7), { an: 'aFade', dur: 500, d: 300 + i * 50 }, { k: 'kBreathe', d: 5.5, dl: -i * .9, vars: { o0: .3 } }));

  emergency(G) {

      <path d="M250 398 V514" style="stroke:var(--a1);stroke-width:24;stroke-linecap:round"/><circle cx="250" cy="570" r="15" style="fill:var(--a1)"/>`;
    return layer(-56, 0, W + 112, 26, band(0), null, { k: 'kDrift', d: 2.6, e: 'linear', dir: 'normal', vars: { dx: 56 } })

  sleek(G) {

  celebration(G) {
    let o = rain(G, 7, pieceConfetti, { nTop: 30, nCol: 11, cols: 4 });

  urgent(G) {

      <path d="M${sx0 + 46} 168 H${sx1 - 46} M${sx0 + 46} ${H - 168} H${sx1 - 46}" style="stroke:color-mix(in srgb, var(--a1) 22%, transparent);stroke-width:1.2"/>`;

      + layer(sx0 + 40, 150, sx1 - sx0 - 80, H - 300, glow(W / 2, H / 2, Math.min(sx1 - sx0, H - 300) * .55, 'var(--a1)', .16), { an: 'aFade', dur: 900, d: 300 }, { k: 'kBreathe', d: 7.5, vars: { o0: .35 } })
      + layer(rl - 60, 20, 120, H - 40, roller(rl), { an: 'aOpenL', dur: 900, d: 0 })
      + layer(rr - 60, 20, 120, H - 40, roller(rr), { an: 'aOpenR', dur: 900, d: 0 });

    const string = (x0, y0, x1, y1, cxp, cyp, step, w, len, op, cols) => {
      const Pt = t => [(1 - t) ** 2 * x0 + 2 * (1 - t) * t * cxp + t * t * x1, (1 - t) ** 2 * y0 + 2 * (1 - t) * t * cyp + t * t * y1];
      let s = `<path d="M${x0} ${y0} Q${cxp} ${cyp} ${x1} ${y1}" style="fill:none;stroke:color-mix(in srgb, var(--s-ink) 40%, transparent);stroke-width:2"/>`;

        const ang = Math.atan2(yb - ya, xb - xa), ux = Math.cos(ang), uy = Math.sin(ang), nx = -uy, ny = ux;

      + layer(0, 0, W, 230, string(-30, 20, W + 30, 34, W / 2, 240, 76 * sc, 52 * sc, 72 * sc, 1, cols), { an: 'aDrop', dur: 900, d: 120, ease: 'cubic-bezier(.2,1.25,.4,1)' }, { k: 'kSway', d: 5.5, dl: -2, o: '50% 0%', vars: { sa: .45 } });
    /* three balloons drift up the margins, fading in and out (period translate, opacity 0 at both ends) */
    const bl = (x, y, c, k, d, dl) => layer(x - 40, y - 60, 80, 170, `<ellipse cx="${x}" cy="${y}" rx="30" ry="38" style="fill:${c}"/><path d="M${x} ${y + 38} l-6 10 h12Z" style="fill:${c}"/><path d="M${x} ${y + 48} q-10 30 4 60" style="fill:none;stroke:color-mix(in srgb, var(--s-ink) 45%, transparent);stroke-width:2"/><ellipse cx="${x - 10}" cy="${y - 12}" rx="6" ry="11" style="fill:#fff;opacity:.28"/>`,

  },

  schedule(G) {
    const cx = 280, cy = 470, r = 176;

    const hand = (deg, len, w, col, dash = '') => { const a = deg * Math.PI / 180; return `<path d="M${cx} ${cy} L${f1(cx + len * Math.sin(a))} ${f1(cy - len * Math.cos(a))}" style="stroke:${col};stroke-width:${w};stroke-linecap:round;${dash}"/>`; };

      <path d="M${cx + R2 - 13} ${cy - 16} L${cx + R2} ${cy + 2} L${cx + R2 + 15} ${cy - 15}" style="fill:none;stroke:color-mix(in srgb, var(--s-acc) 70%, transparent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/>`;

      + L(hand(67.5, 92, 9, 'var(--s-acc)'), 'aTurnH', 150) + L(hand(90, 140, 6, 'var(--s-acc)') + `<circle cx="${cx}" cy="${cy}" r="11" style="fill:var(--s-acc)"/>`, 'aTurnM', 150)
      + layer(cx - 220, cy - 220, 440, 440, `<path d="M${cx} ${cy + 24} L${cx} ${cy - 150}" style="stroke:var(--s-ink);stroke-width:2;stroke-linecap:round;opacity:.55"/><circle cx="${cx}" cy="${cy - 150}" r="4" style="fill:var(--s-ink);opacity:.55"/>`, { an: 'aFade', dur: 500, d: 600 }, { k: 'kSpin', d: 60, e: 'linear', dir: 'normal' }));

  chanukah(G) {

    const xs = [-4, -3, -2, -1, 1, 2, 3, 4].map(k => cx + k * sp);
    xs.forEach(x => { const d = Math.abs(x - cx); arms += `<path d="M${cx} ${cupY + 26 + d * 1.15} L${x} ${cupY + 14}" class="ln" style="stroke-width:5"/>`; });
    arms += `<path d="M${cx} ${cupY - 54} V790" class="ln" style="stroke-width:7"/><path d="M${cx - 64} 792 Q${cx} 744 ${cx + 64} 792Z" class="ln" style="fill:color-mix(in srgb, var(--a1) 24%, var(--s-bg));stroke-width:4"/>`;
    [...xs, cx].forEach((x, i) => { const y = i === 8 ? cupY - 68 : cupY;
      cups += `<rect x="${x - 15}" y="${y}" width="30" height="14" rx="3" style="fill:var(--a1)"/><rect x="${x - 6}" y="${y - 34}" width="12" height="34" rx="2" style="fill:var(--a4);stroke:color-mix(in srgb, var(--s-ink) 22%, transparent);stroke-width:1.5"/>`;

      [8, 7, 6, 5, 4, 3, 2, 1, 0].forEach((idx, k) => { const [x, y] = fl[idx];
        out += layer(x - 16, y - 46, 32, 50, flame(x, y, 40), { an: 'aFlame', dur: 300, d: 300 + k * 70, o: '50% 100%' }, { k: k % 2 ? 'kFlameB' : 'kFlameA', d: 2.4 + (k % 4) * .35, dl: -k * .7, o: '50% 100%' }); });

  purim(G) {
    const crown = `<path d="M130 560 L110 380 L200 460 L290 340 L380 460 L470 380 L450 560Z" style="fill:color-mix(in srgb, var(--a1) 20%, var(--s-bg));stroke:var(--a1);stroke-width:5;stroke-linejoin:round"/>
      <rect x="126" y="560" width="328" height="44" rx="8" style="fill:var(--a1)"/>
      ${[[110, 380], [290, 340], [470, 380]].map(([x, y]) => `<circle cx="${x}" cy="${y - 8}" r="15" style="fill:var(--a2)"/>`).join('')}
      ${[0, 1, 2, 3, 4].map(i => `<circle cx="${170 + i * 60}" cy="582" r="9" style="fill:${['var(--a2)', 'var(--a3)', 'var(--a4)', 'var(--a3)', 'var(--a2)'][i]}"/>`).join('')}`;
    return rain(G, 13, pieceHaman, { nTop: 14, nCol: 6, cols: 4 })
      + side(() => layer(100, 320, 400, 300, crown, { an: 'aInsert', dur: 800, d: 120, ease: 'cubic-bezier(.2,.9,.3,1.15)' }, { k: 'kBob', d: 4.6, vars: { by: -8 } })
        + layer(90, 290, 420, 80, [[110, 372], [290, 332], [470, 372]].map(([x, y]) => star4(x, y - 30, 12, 'fill:var(--a4)')).join(''), { an: 'aFade', dur: 600, d: 500 }, { k: 'kTwinkle', d: 3.3 }));

  pesach(G) {

      <path d="M0 -50 V-12 M-26 -8 H26" style="stroke:var(--a1);stroke-width:6;stroke-linecap:round"/><path d="M-36 -98 H36" style="stroke:var(--a1);stroke-width:2;opacity:.6"/></g>`;
    const by = H - 70, gap = (W - 260) / 3; let out = '';

  roshchodesh(G) {

  },
};

    if (S.bb) { const [x0, y0, x1, y1] = S.bb, bw = x1 - x0, bh = y1 - y0, s = Math.min((W - 120) / bw, 420 / bh, 1); SIDE = { s, ox: W / 2 - s * (x0 + x1) / 2, oy: 110 + (420 - s * bh) / 2 - s * y0 };
      L = 70; R = 70; Tp = Math.round(110 + (420 + s * bh) / 2 + 40); B = 120; ARTRECTS.push({ x: SIDE.ox + s * x0, y: SIDE.oy + s * y0, w: s * bw, h: s * bh }); }

  } else {
    const dy = (H - 900) / 2; Tp += dy; B += dy;
    if (S.bb) { const [x0, y0, x1, y1] = S.bb; SIDE = { s: 1, ox: 0, oy: H / 2 - (y0 + y1) / 2 }; ARTRECTS.push({ x: x0, y: SIDE.oy + y0, w: x1 - x0, h: y1 - y0 }); }
  }
  const G = { W, H, port: PORT, light, box: [L, Tp, W - R, H - B] };
  MAP = ID;
  const art = ART[P.style] ? ART[P.style](G) : '';
  const ch = { top: 34, side: 56, bottom: 34, ...(S.chrome || {}) };
  const pos = p => ({ tl: `top:${ch.top}px;left:${ch.side}px`, tr: `top:${ch.top}px;right:${ch.side}px`, bl: `bottom:${ch.bottom}px;left:${ch.side}px`, br: `bottom:${ch.bottom}px;right:${ch.side}px` }[p]);
  const clock = `<div class="chrome num" style="${pos(S.clock || 'tl')}">12:41 PM</div>`;
  const bh = (S.bh || 'tr') === 'none' ? '' : `<div class="chrome bh" style="${pos(S.bh || 'tr')}">ב״ה</div>`;
  const ent = P.motion === 'lively' ? 'lively' : S.ent, lively = P.motion === 'lively' || S.ent === 'lively';
  const bw = W - L - R;
  const cls = ['stage', `st-${P.style}`, align, `mo-${ent}`, bw < 1000 ? 'narrow' : '', PORT ? 'port' : '', P.enter ? 'enter' : '', lively ? 'x-lively' : '', `anim-${ANIM}`].join(' ');
  document.getElementById('app').innerHTML = `<div class="${cls}" style="width:${W}px;height:${H}px${P.ts ? `;--ts:${P.ts}` : ''}">
    <div class="art stage-in">${art}</div>${clock}${bh}
    <div class="box" style="left:${L}px;right:${R}px;top:${Tp}px;bottom:${B}px">${LAYOUTS[layout](m)}</div></div>`;
  window.__box = G.box; window.__art = ARTRECTS;
  fitAll(); alignGlyph();
}

/* ── fitting (one-shot binary searches, never per frame) ── */
function fitEl(el) {
  let lo = +el.dataset.min || 16, hi = +el.dataset.max || 200;
  if (el.classList.contains('disp-he') || el.classList.contains('q-he')) { const hs = +getComputedStyle(document.documentElement).getPropertyValue('--he-scale') || 1; hi = Math.round(hi * hs); lo = Math.round(lo * hs); }
  const mh = +el.dataset.h; if (mh) el.style.maxHeight = mh + 'px';
  const nw = el.classList.contains('nw') && !el.classList.contains('big'); const ok = () => el.scrollWidth <= el.clientWidth + 1 && (nw || el.scrollHeight <= el.clientHeight + parseFloat(el.style.fontSize) * .2);
  el.style.display = ''; el.style.webkitLineClamp = ''; el.removeAttribute('data-over');
  const floor = lo; let best = floor, a = floor, b = hi;
  el.style.fontSize = floor + 'px';
  if (!ok()) { el.dataset.over = '1'; const lines = Math.max(1, Math.floor(el.clientHeight / (floor * 1.14))); el.style.display = '-webkit-box'; el.style.webkitBoxOrient = 'vertical'; el.style.webkitLineClamp = lines; return; }
  while (b - a > 1) { const mid = (a + b) >> 1; el.style.fontSize = mid + 'px'; ok() ? (a = mid) : (b = mid); }
  el.style.fontSize = a + 'px'; el.dataset.fit = a;
}
function fitAll() {
  document.querySelectorAll('.fit, .pw').forEach(el => { el.style.height = ''; });
  document.querySelectorAll('.fit').forEach(fitEl);
  document.querySelectorAll('.fit.wrap, .fit.big').forEach(el => { if (el.dataset.over) return; el.style.maxHeight = ''; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; });
  document.querySelectorAll('.pw').forEach(el => { el.style.height = 'auto'; });
  /* quick name row: one line while it fits at >= .75, else stacked (He over En), scaled down to .45 */
  document.querySelectorAll('.qt .nm').forEach(el => { const Wd = el.parentElement.clientWidth; el.classList.remove('stack'); let k = 1; el.style.setProperty('--k', k);
    const fits = () => el.scrollWidth <= Wd + 1;
    while (!fits() && k > .75) { k -= .02; el.style.setProperty('--k', k.toFixed(2)); }
    if (!fits()) { el.classList.add('stack'); k = 1; el.style.setProperty('--k', k); while (!fits() && k > .45) { k -= .02; el.style.setProperty('--k', k.toFixed(2)); } } });
  /* two-time quick layout: one size for both, fitted to the narrower column */
  const ts = [...document.querySelectorAll('.times .tcol .t')];
  if (ts.length) { let s = 170; const ok = () => ts.every(t => { const c = t.parentElement, cs = getComputedStyle(c); return t.scrollWidth <= c.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) + 1; });
    ts.forEach(t => t.style.display = 'inline-block'); do { ts.forEach(t => t.style.fontSize = s + 'px'); s -= 4; } while (!ok() && s > 60); ts.forEach(t => t.style.display = ''); }
  /* quick layout is height-aware: if the whole stack is taller than the box, shrink name and times together */
  document.querySelectorAll('.lyt.qt').forEach(l => { let n = 0; while (l.scrollHeight > l.clientHeight + 4 && n++ < 40) {
    const nm = l.querySelector('.nm'), k = parseFloat(nm.style.getPropertyValue('--k') || 1); if (k > .45) nm.style.setProperty('--k', (k - .03).toFixed(2));
    l.querySelectorAll('.tcol .t').forEach(t => { const fs = parseFloat(t.style.fontSize) || 150; if (fs > 64) t.style.fontSize = (fs - 6) + 'px'; });
    const w = l.querySelector('.where'); if (w && n > 8) { const fs = parseFloat(w.style.fontSize); if (fs > 24) w.style.fontSize = (fs - 1) + 'px'; } } });
  /* event tile: shrink the time until the tile fits its row (narrow: full width; wide: <= 62%) */
  document.querySelectorAll('.tile').forEach(tile => { const foot = tile.parentElement, st = tile.closest('.stage'); const narrow = st.classList.contains('narrow');
    const lim = foot.clientWidth * (narrow || !foot.querySelector('.place') ? 1 : .62); let s = narrow ? 112 : 140; tile.style.setProperty('--tile-size', s + 'px');
    tile.classList.remove('stackt');
    while (tile.getBoundingClientRect().width > lim && s > 72) { s -= 4; tile.style.setProperty('--tile-size', s + 'px'); }
    if (tile.getBoundingClientRect().width > lim) { tile.classList.add('stackt'); s = narrow ? 112 : 140; tile.style.setProperty('--tile-size', s + 'px'); while (tile.getBoundingClientRect().width > lim && s > 72) { s -= 4; tile.style.setProperty('--tile-size', s + 'px'); } } });
  /* place block: scale down (min .6) until it fits beside / under the tile */
  document.querySelectorAll('.place').forEach(pl => { pl.style.setProperty('--k', 1); let k = 1; const foot = pl.parentElement, tile = foot.querySelector('.tile'), narrow = pl.closest('.stage').classList.contains('narrow');
    const maxH = narrow ? 190 : Math.max(190, tile ? tile.offsetHeight : 190);
    const room = narrow ? foot.clientWidth : foot.clientWidth - (tile ? tile.offsetWidth : 0) - 44;
    pl.style.maxWidth = Math.max(160, room) + 'px';
    while ((pl.scrollHeight > maxH || pl.scrollWidth > pl.clientWidth + 1) && k > .6) { k -= .04; pl.style.setProperty('--k', k.toFixed(2)); } });
  /* list rows: one size for every row (largest that fits the tightest row) */
  document.querySelectorAll('.items').forEach(it => { let s = 44; const rows = [...it.querySelectorAll('.li')];
    const ok = () => rows.every(r => { const x = r.querySelector('.x'); return r.scrollHeight <= r.clientHeight + 1 && x.scrollWidth <= x.clientWidth + 1 && r.scrollWidth <= r.clientWidth + 1; });
    it.style.setProperty('--lf', s); while (!ok() && s > 24) { s -= 1; it.style.setProperty('--lf', s); } it.dataset.lf = s; });
  /* pagination at a fixed reading size */
  document.querySelectorAll('.paged').forEach(el => {
    const paras = el.dataset.text.split('|'); const words = paras.map((p, i) => p.split(' ').map((w, j) => ({ w, br: j === 0 && i > 0 }))).flat();
    const build = arr => '<p>' + arr.map((x, k) => (x.br && k > 0 ? '</p><p>' : '') + x.w).join(' ').replace(/<p> /g, '<p>') + '</p>';
    const pages = []; let i = 0;
    while (i < words.length) {
      let j = i + 1; el.innerHTML = build(words.slice(i, j));
      while (j < words.length) { el.innerHTML = build(words.slice(i, j + 1)); if (el.scrollHeight > el.clientHeight + 1) break; j++; }
      if (j < words.length) { let k = j; while (k > i && !words[k].br) k--; if (k > i && (k - i) >= (j - i) * .6) j = k;
        else { k = j; while (k > i + 20 && !/[.!?”:]$/.test(words[k - 1].w)) k--; if (k > i + 20) j = k; } }
      pages.push(words.slice(i, j)); i = j;
    }
    const cur = Math.min(P.pg, pages.length) - 1; el.innerHTML = build(pages[cur]);
    const pg = el.closest('.lyt').querySelector('.pg');
    if (pg) pg.innerHTML = pages.length < 2 ? '' : `<span class="num">${cur + 1} / ${pages.length}</span>` + pages.map((_, k) => `<i class="${k === cur ? 'on' : ''}"></i>`).join('');
    el.dataset.pages = pages.length;
  });
}
/* urgent: the glyph in the bar sits on the same line as the kicker (or the first title line when there is no kicker) */
function alignGlyph() {
  const g = document.querySelector('.glyph'); if (!g) return;
  const k = document.querySelector('.kick') || document.querySelector('.fit'); if (!k) return;
  const st = document.querySelector('.stage').getBoundingClientRect(), kr = k.getBoundingClientRect(), gr = g.getBoundingClientRect();
  const target = kr.top - st.top + (document.querySelector('.kick') ? kr.height / 2 : Math.min(kr.height / 2, 40));
  g.style.top = (parseFloat(g.style.top) + target - (gr.top - st.top + gr.height / 2)) + 'px';
}
/* lively extras: split big words / digits so they reveal one by one (entrance only) */
function splitLively() {
  document.querySelectorAll('.enter.x-lively .w-he, .enter.x-lively .w-en, .enter.x-lively .h-he, .enter.x-lively .h-en, .enter.x-lively .q-he').forEach(el => {
    if (el.children.length) return; el.innerHTML = el.textContent.split(' ').map((w, i) => `<span class="w" style="--wi:${i}">${w}</span>`).join(' '); });
  document.querySelectorAll('.enter.x-lively .big, .enter.x-lively .tile .t, .enter.x-lively .tcol .t').forEach(el => {
    let n = 0; const walk = node => { [...node.childNodes].forEach(c => { if (c.nodeType === 3) { const f = document.createDocumentFragment(); [...c.textContent].forEach(ch => { if (/[0-9]/.test(ch)) { const s = document.createElement('span'); s.className = 'dg'; s.style.setProperty('--wi', n++); s.textContent = ch; f.appendChild(s); } else f.appendChild(document.createTextNode(ch)); }); c.replaceWith(f); } else if (c.nodeType === 1 && !c.classList.contains('pre')) walk(c); }); };
    walk(el); });
}

render();
const fams = [F.heDisp, F.he, F.enDisp, F.en, F.thHe, F.thEn].map(f => f.split(',')[0]);
Promise.all(fams.flatMap(f => ['400', '600', '700'].map(w => document.fonts.load(`${w} 40px ${f}`, 'אבג Ab12')))).catch(() => {}).then(() => document.fonts.ready).then(() => {
  fitAll(); alignGlyph(); splitLively();
  if (P.t != null) document.getAnimations().forEach(a => { a.pause(); a.currentTime = +P.t; });
  window.__ready = true;
});
