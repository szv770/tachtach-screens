<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction C · Glance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Assistant:wght@500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&family=EB+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'FbMazalMedium'; src: url('fonts/FbMazalMedium.ttf') format('truetype'); }
/*
  Direction C — "Glance"  (Apple TV / widget dashboard / bento)
  Solid rounded cards on a flat background. No blur, no translucency stacking, no animation loops.
  Colors = token roles (tokens.js keys + surface2/onAccent). Fonts = font roles (+ numeric).
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
body { color: var(--text); font-family: var(--f-en); -webkit-font-smoothing: antialiased; }
.canvas { position: fixed; inset: 0; padding: 24px; display: grid; grid-template-columns: minmax(400px, 28.5%) 1fr; grid-template-rows: 1fr 64px; gap: 16px; }

.he { direction: rtl; font-family: var(--f-he); }
.hed { direction: rtl; font-family: var(--f-he-display); font-weight: 800; }
.num { font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum" 1, "tnum" 1; }
.cap { font-family: var(--f-en-display); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; font-size: 15px; }

.card { background: var(--surface); border-radius: 28px; padding: 22px 26px; min-width: 0; }
.col { display: flex; flex-direction: column; gap: 16px; min-height: 0; }

.clock { container-type: inline-size; }
.clock .t { font-size: min(132px, 30cqw); font-weight: 700; letter-spacing: -.045em; line-height: .9; display: flex; align-items: flex-start; }
.clock .t small { font-size: 26px; letter-spacing: 0; font-weight: 700; color: var(--dim); margin: 14px 0 0 10px; }
.clock .d { font-size: 24px; color: var(--dim); font-weight: 600; margin-top: 8px; }

.date { text-align: right; container-type: inline-size; }
.date .d { font-size: 54px; line-height: 1.05; }
.date .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: var(--accentBg); color: var(--accent); font-weight: 700; }
.date .row .he { white-space: nowrap; font-size: min(28px, 7cqw); color: var(--dim); font-weight: 600; }

.wx { display: flex; align-items: center; gap: 16px; padding: 16px 24px; }
.wx svg { width: 58px; height: 58px; flex: none; }
.wx .deg { font-size: 58px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.wx .m { display: flex; flex-direction: column; font-size: 21px; font-weight: 600; white-space: nowrap; }
.wx .m .b { color: var(--dim); }
.wx .he { margin-left: auto; font-size: 24px; color: var(--dim); font-weight: 600; }

.up { flex: 1; background: var(--accent); color: var(--onAccent); display: flex; flex-direction: column; }
.up .top { display: flex; justify-content: space-between; align-items: center; opacity: .85; }
.up .top .he { font-size: 20px; font-weight: 700; }
.up .nm { font-size: 48px; text-align: right; line-height: 1.1; margin-top: 8px; }
.up .bot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
.up .bot .en { font-size: 26px; font-weight: 700; line-height: 1.2; }
.up .bot .en span { display: block; font-size: 22px; opacity: .8; font-weight: 600; }
.up .bot .eta { font-size: 96px; font-weight: 800; letter-spacing: -.04em; line-height: .85; }
.up .bot .eta small { font-size: 30px; letter-spacing: 0; margin-left: 4px; }

/* slide card */
.slide { display: flex; flex-direction: column; padding: 22px 28px 26px; min-height: 0; }
.shead { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.shead .chip { font-size: 20px; padding: 8px 18px; }
.shead .sub { font-size: 20px; color: var(--dim); font-weight: 600; }
.shead .dots { display: flex; gap: 6px; margin-left: auto; margin-right: 18px; }
.shead .dots i { width: 10px; height: 10px; border-radius: 5px; background: var(--frame2); }
.shead .dots i.cur { width: 34px; background: var(--accent); }
.shead .ht { font-size: 36px; }
.sbody { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; }

.arc { flex: none; height: 216px; background: var(--surface2); border-radius: 22px; position: relative; overflow: hidden; }
.arc svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.arc .lab { position: absolute; font-weight: 700; font-size: 18px; color: var(--dim); }
.arc .lab b { display: block; font-size: 30px; color: var(--text); }
.arc .lab .he { font-size: 22px; display: block; }

.tiles { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile { position: relative; background: var(--surface2); border-radius: 22px; padding: 16px 20px; display: flex; flex-direction: column; min-width: 0; }
.tile .hn { font-size: 34px; text-align: right; line-height: 1.1; white-space: nowrap; }
.tile .en { font-size: 17px; color: var(--dim); font-weight: 600; text-align: right; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .tm { margin-top: auto; font-size: 54px; font-weight: 700; letter-spacing: -.035em; line-height: 1; display: flex; align-items: baseline; justify-content: space-between; }
.tile .tm small { font-size: 18px; letter-spacing: 0; color: var(--dim); margin-left: 4px; }
.tile .tm .ck { position: absolute; top: 18px; left: 18px; font-size: 16px; letter-spacing: 0; color: var(--muted); }
.tile.past { opacity: .42; }
.tile.next { background: var(--accent); color: var(--onAccent); }
.tile.next .en, .tile.next .tm small { color: var(--onAccent); opacity: .8; }
.tile.next .tm .ck { top: 84px; font-size: 18px; color: var(--accent); background: var(--onAccent); padding: 4px 10px; border-radius: 999px; font-weight: 800; opacity: 1; }

/* announcement */
.slide.ann { background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 55%, #000 45%) 100%); color: #fff; }
.slide.ann .chip { background: rgba(255,255,255,.18); color: #fff; }
.slide.ann .dots i { background: rgba(255,255,255,.3); } .slide.ann .dots i.cur { background: #fff; }
.annb { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; padding: 0 10px; }
.fit { white-space: nowrap; overflow: hidden; line-height: 1.1; }
.annb .h1 { height: 270px; font-family: var(--f-he-display); font-weight: 800; direction: rtl; text-align: right; }
.annb .h2 { height: 150px; font-family: var(--f-en-display); font-weight: 800; letter-spacing: -.03em; }
.annb .pills { display: flex; gap: 16px; margin-top: 30px; }
.annb .pill { display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,.16); border-radius: 26px; padding: 16px 28px; font-weight: 800; font-size: 50px; letter-spacing: -.02em; }
.annb .pill svg { width: 44px; height: 44px; }
.annb .pill .he { font-size: 34px; font-weight: 700; opacity: .9; letter-spacing: 0; }

/* schedule */
.pair { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: 262px; }
.big { border-radius: 22px; padding: 20px 24px; display: flex; flex-direction: column; background: var(--surface2); }
.big .top { display: flex; justify-content: space-between; align-items: center; }
.big .nm { font-size: 58px; text-align: right; line-height: 1.1; margin-top: 4px; }
.big .en { font-size: 24px; font-weight: 700; color: var(--dim); text-align: right; }
.big .bar { margin-top: auto; height: 12px; border-radius: 6px; background: var(--frame2); overflow: hidden; }
.big .bar i { display: block; height: 100%; width: 91%; background: var(--copper); border-radius: 6px; }
.big .ft { display: flex; justify-content: space-between; margin-top: 10px; font-size: 20px; font-weight: 700; color: var(--dim); }
.big.nx { background: var(--accent); color: var(--onAccent); }
.big.nx .en { color: var(--onAccent); opacity: .8; }
.big.nx .eta { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
.big.nx .eta b { font-size: 84px; font-weight: 800; letter-spacing: -.04em; line-height: .85; }
.big.nx .eta b small { font-size: 28px; letter-spacing: 0; }
.big.nx .eta span { font-size: 28px; font-weight: 700; }
.chip.now { background: color-mix(in srgb, var(--copper) 22%, transparent); color: var(--copper); }
.chip.inv { background: var(--onAccent); color: var(--accent); }
.list { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(4, minmax(0, 1fr)); column-gap: 16px; row-gap: 10px; }
.li { display: flex; align-items: center; gap: 18px; padding: 0 22px; border-radius: 18px; background: var(--surface2); min-width: 0; }
.li .tm { width: 140px; font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
.li .tm small { font-size: 16px; color: var(--dim); letter-spacing: 0; margin-left: 3px; }
.li .en { font-size: 20px; color: var(--dim); font-weight: 600; }
.li .he { margin-left: auto; font-size: 34px; font-family: var(--f-he-display); font-weight: 700; }
.li.past { opacity: .4; }
.li.now { box-shadow: inset 0 0 0 3px var(--copper); }
.li.next { background: var(--accent); color: var(--onAccent); } .li.next .en, .li.next .tm small { color: var(--onAccent); opacity: .8; }

/* banner */
.banner { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; background: var(--surface); border-radius: 999px; padding: 0 12px 0 10px; white-space: nowrap; overflow: hidden; }
.banner .ic { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: none; }
.banner .ic svg { width: 24px; height: 24px; }
.banner .tx { font-size: 26px; font-weight: 600; } .banner .he { font-size: 30px; font-weight: 600; }
.banner .sep { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
</style>
</head>
<body>
<div class="canvas" id="app"></div>
<script>
const THEMES = {
  dark:  { bg:'#0A0C10', surface:'#15181E', surface2:'#1E222A', text:'#F4F6F9', dim:'rgba(244,246,249,.62)', muted:'rgba(244,246,249,.34)',
           gold:'#5B9BFF', goldBg:'rgba(91,155,255,.16)', goldBd:'rgba(91,155,255,.45)', copper:'#3CCFA8', onAccent:'#FFFFFF',
           framePrimary:'rgba(244,246,249,.08)', frameSecondary:'rgba(244,246,249,.16)' },
  light: { bg:'#E8EBF0', surface:'#FFFFFF', surface2:'#F2F4F7', text:'#10141A', dim:'rgba(16,20,26,.60)', muted:'rgba(16,20,26,.32)',
           gold:'#2466D8', goldBg:'rgba(36,102,216,.10)', goldBd:'rgba(36,102,216,.35)', copper:'#0E9E78', onAccent:'#FFFFFF',
           framePrimary:'rgba(16,20,26,.08)', frameSecondary:'rgba(16,20,26,.14)' },
};
const FONTS = {
  default: { hebrewDisplay:"'Assistant', sans-serif", hebrewPrimary:"'Assistant', sans-serif", englishDisplay:"'Manrope', sans-serif", englishBody:"'Manrope', sans-serif", numeric:"'Manrope', sans-serif" },
  serif:   { hebrewDisplay:"'FbMazalMedium','Frank Ruhl Libre', serif", hebrewPrimary:"'FbMazalMedium','Frank Ruhl Libre', serif", englishDisplay:"'EB Garamond', serif", englishBody:"'EB Garamond', serif", numeric:"'EB Garamond', serif" },
};
const q = new URLSearchParams(location.search);
const screen = q.get('screen') || 'main', theme = THEMES[q.get('theme') || 'dark'], fonts = FONTS[q.get('fonts') || 'default'];
const r = document.documentElement.style;
const map = { bg:'bg', surface:'surface', surface2:'surface2', text:'text', dim:'dim', muted:'muted', gold:'accent', goldBg:'accentBg', goldBd:'accentBd', copper:'copper', onAccent:'onAccent', framePrimary:'frame1', frameSecondary:'frame2' };
for (const k in map) r.setProperty('--' + map[k], theme[k]);
r.setProperty('--f-he-display', fonts.hebrewDisplay); r.setProperty('--f-he', fonts.hebrewPrimary);
r.setProperty('--f-en-display', fonts.englishDisplay); r.setProperty('--f-en', fonts.englishBody); r.setProperty('--f-num', fonts.numeric);

const ZMANIM = [
  { he:'עלות השחר', en:'Alos Hashachar', t:'6:01', ap:'AM', s:'past' },
  { he:'הנץ החמה', en:'Netz Hachamah', t:'7:19', ap:'AM', s:'past' },
  { he:'סוף זמן ק״ש', en:'Sof Zman Shema', t:'10:08', ap:'AM', s:'past' },
  { he:'חצות היום', en:'Chatzos', t:'12:57', ap:'PM', s:'next' },
  { he:'מנחה גדולה', en:'Mincha Gedolah', t:'1:25', ap:'PM' },
  { he:'פלג המנחה', en:'Plag Hamincha', t:'5:24', ap:'PM' },
  { he:'שקיעה', en:'Shkiah', t:'6:35', ap:'PM' },
  { he:'צאת הכוכבים', en:'Tzeis Hakochavim', t:'7:01', ap:'PM' },
];
const SCHEDULE = [
  { he:'שחרית', en:'Shacharis', t:'7:30', ap:'AM', s:'past' },
  { he:'ארוחת בוקר', en:'Breakfast', t:'8:45', ap:'AM', s:'past' },
  { he:'סדר בוקר', en:'Seder', t:'9:30', ap:'AM', s:'now' },
  { he:'ארוחת צהריים', en:'Lunch', t:'1:00', ap:'PM', s:'next' },
  { he:'מנחה', en:'Mincha', t:'1:45', ap:'PM' },
  { he:'סדר ערב', en:'Night Seder', t:'7:30', ap:'PM' },
  { he:'מעריב', en:'Maariv', t:'9:00', ap:'PM' },
];
const SUN = `<svg viewBox="0 0 64 64" fill="none"><circle cx="24" cy="24" r="10" fill="#FFC23D"/><g stroke="#FFC23D" stroke-width="3.5" stroke-linecap="round"><path d="M24 4v5M24 39v5M4 24h5M39 24h5M10 10l3.5 3.5M34.5 34.5L38 38M38 10l-3.5 3.5M10 38l3.5-3.5"/></g><path d="M22 52h28a9 9 0 0 0 0-18 13 13 0 0 0-25 4 7 7 0 0 0-3 14z" fill="var(--text)" opacity=".9"/></svg>`;
const MEGA = `<svg viewBox="0 0 24 24" fill="none" stroke="var(--onAccent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg>`;
const CAL = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`;
const CLK = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;

// left column — the "up next" widget de-duplicates against the current slide
const upNextSchedule = `<div class="card up"><div class="top"><span class="cap">Up next</span><span class="he">הבא בסדר היום</span></div>
  <div class="nm hed">ארוחת צהריים</div>
  <div class="bot"><div class="en">Lunch<span class="num">1:00 PM</span></div><div class="eta num">19<small>min</small></div></div></div>`;
const upNextZman = `<div class="card up"><div class="top"><span class="cap">Next zman</span><span class="he">הזמן הבא</span></div>
  <div class="nm hed">חצות היום</div>
  <div class="bot"><div class="en">Chatzos<span class="num">12:57 PM</span></div><div class="eta num">16<small>min</small></div></div></div>`;
const left = (up) => `<div class="col">
  <div class="card clock"><div class="t num">12:41<small>PM</small></div><div class="d">Tuesday, October 13</div></div>
  <div class="card date"><div class="d hed">ב׳ חשון תשפ״ז</div><div class="row"><span class="chip" style="font-size:18px">Parshas Noach</span><span class="he">יום שלישי · פרשת נח</span></div></div>
  <div class="card wx">${SUN}<span class="deg num">84°</span><div class="m"><span>Partly cloudy</span><span class="b num">H 88° · L 77°</span></div></div>
  ${up}
</div>`;

function slide(title, sub, heTitle, body, idx, cls = '') {
  const dots = Array.from({ length: 7 }, (_, i) => `<i class="${i === idx ? 'cur' : ''}"></i>`).join('');
  return `<div class="card slide ${cls}"><div class="shead"><span class="chip">${title}</span><span class="sub">${sub}</span><span class="dots">${dots}</span><span class="ht hed">${heTitle}</span></div><div class="sbody">${body}</div></div>`;
}

// sun path: x from netz(7:19) to shkia(6:35); now 12:41
function arcSvg() {
  const W = 1028, H = 216, x0 = 70, x1 = W - 70, base = 176, top = 44;
  const pt = f => { const x = x0 + (x1 - x0) * f; const y = base - (base - top) * Math.sin(Math.PI * f); return [x, y]; };
  const path = n => Array.from({ length: n + 1 }, (_, i) => pt(i / n * (n === 60 ? 1 : 1))).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const fNow = 322 / 676, fCh = 338 / 676, fPlag = 605 / 676, fMg = 366 / 676;
  const done = Array.from({ length: 41 }, (_, i) => pt(fNow * i / 40)).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const [sx, sy] = pt(fNow), [cx, cy] = pt(fCh), [px, py] = pt(fPlag), [mx, my] = pt(fMg);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="24" x2="${W - 24}" y1="${base}" y2="${base}" stroke="var(--frame2)" stroke-width="2"/>
    <path d="${path(60)}" fill="none" stroke="var(--frame2)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <path d="${done}" fill="none" stroke="#FFC23D" stroke-width="5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="7" fill="var(--accent)"/><circle cx="${mx}" cy="${my}" r="5" fill="var(--dim)"/><circle cx="${px}" cy="${py}" r="5" fill="var(--dim)"/>
    <circle cx="${x0}" cy="${base}" r="6" fill="var(--text)"/><circle cx="${x1}" cy="${base}" r="6" fill="var(--text)"/>
    <circle cx="${sx}" cy="${sy}" r="17" fill="#FFC23D"/><circle cx="${sx}" cy="${sy}" r="25" fill="none" stroke="#FFC23D" stroke-opacity=".35" stroke-width="3"/>
  </svg>
  <div class="lab" style="left:28px;bottom:6px">Netz <b class="num" style="display:inline;font-size:22px">7:19</b></div>
  <div class="lab" style="right:28px;bottom:6px">Shkiah <b class="num" style="display:inline;font-size:22px">6:35</b></div>
  <div class="lab" style="left:${cx + 22}px;top:14px;color:var(--accent)">Chatzos <b class="num" style="display:inline;font-size:22px;color:var(--accent)">12:57 · in 16 min</b></div>
  <div class="lab" style="left:${px - 150}px;top:${py - 52}px">Plag <b class="num" style="display:inline;font-size:22px">5:24</b></div>
  <div class="lab" style="left:0;right:0;bottom:8px;text-align:center">Now <b class="num" style="display:inline;font-size:22px">12:41</b> · day is 48% through · shaah zmanis 56 min</div>`;
}

const zBody = `<div class="arc">${arcSvg()}</div>
  <div class="tiles">${ZMANIM.map(z => `<div class="tile ${z.s || ''}"><div class="hn hed">${z.he}</div><div class="en">${z.en}</div>
    <div class="tm num"><span>${z.t}<small>${z.ap}</small></span>${z.s === 'next' ? '<span class="ck">in 16 min</span>' : z.s === 'past' ? '<span class="ck">✓</span>' : ''}</div></div>`).join('')}</div>`;

const aBody = `<div class="annb">
  <div class="fit h1" data-max="300">מבצע תפילין</div>
  <div class="fit h2" data-max="170">Mivtza Tefillin</div>
  <div class="pills"><div class="pill">${CAL}<span>Thursday</span><span class="he">יום חמישי</span></div><div class="pill">${CLK}<span class="num">2:00 PM</span></div></div>
  <div style="margin-top:22px;display:flex;justify-content:space-between;font-size:26px;font-weight:600;opacity:.85"><span>All bochurim · Meet in the front lobby</span><span class="he" style="font-size:30px">כל התלמידים · בלובי</span></div>
</div>`;

const sBody = `<div class="pair">
    <div class="big"><div class="top"><span class="chip now cap">Now</span><span class="he" style="font-size:20px;color:var(--dim);font-weight:700">עכשיו</span></div>
      <div class="nm hed">סדר בוקר</div><div class="en">Seder · <span class="num">9:30 AM – 1:00 PM</span></div>
      <div class="bar"><i></i></div><div class="ft"><span class="num">9:30</span><span class="num">19 min left</span><span class="num">1:00</span></div></div>
    <div class="big nx"><div class="top"><span class="chip inv cap">Up next</span><span class="he" style="font-size:20px;font-weight:700">הבא</span></div>
      <div class="nm hed">ארוחת צהריים</div><div class="en">Lunch · <span class="num">1:00 PM</span></div>
      <div class="eta"><span>Starts in</span><b class="num">19<small> min</small></b></div></div>
  </div>
  <div class="list">${SCHEDULE.map(z => `<div class="li ${z.s || ''}"><span class="tm num">${z.t}<small>${z.ap}</small></span><span class="en">${z.en}</span><span class="he">${z.he}</span></div>`).join('')}</div>`;

const banner = `<div class="banner"><span class="ic">${MEGA}</span><span class="tx">Farbrengen tonight after Maariv in the zal</span><span class="sep"></span><span class="he">התוועדות הערב אחרי מעריב בזאל</span><span class="sep"></span><span class="tx">Bring your siddur</span></div>`;

const S = {
  main: left(upNextSchedule) + slide('Zmanim', 'Miami Beach · Tuesday', 'זמני היום', zBody, 1),
  announce: left(upNextSchedule) + slide('Announcement', 'This week', 'הודעה', aBody, 3, 'ann'),
  schedule: left(upNextZman) + slide('Today’s Schedule', 'Tuesday · Yeshiva day', 'סדר היום', sBody, 2),
}[screen];
document.getElementById('app').innerHTML = S + banner;

function fitAll() {
  document.querySelectorAll('.fit').forEach(el => {
    let lo = 20, hi = +el.dataset.max || 200;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; el.style.fontSize = mid + 'px';
      (el.scrollWidth <= el.clientWidth && el.scrollHeight <= el.clientHeight + 2) ? lo = mid : hi = mid; }
    el.style.fontSize = lo + 'px';
  });
}
document.fonts.ready.then(() => { fitAll(); window.__ready = true; });
</script>
</body>
</html>
