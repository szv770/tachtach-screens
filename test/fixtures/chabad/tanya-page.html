<html><body><h2>Likkutei Amarim, Chapter 5</h2>
<div class="co_commentary">Commentary that must not be read.</div>
<p><span lang="he" class="alternate_he">ותנא בראשית ברא אלקים את השמים ואת הארץ<sup>1</sup> והארץ היתה תהו ובהו וחשך על פני תהום ורוח אלקים</span>
<span lang="he" class="alternate_he">מרחפת על פני המים ויאמר אלקים יהי אור ויהי אור<sup>2</sup></span></p>
<div class="dedication">הרה"ת ר' יוסף ב"ר זאב ע"ה</div></body></html>
