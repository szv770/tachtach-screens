<!DOCTYPE html>
<html lang="en" data-splash="session">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12100C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TachTach">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon-192.png">
  <title>TachTach-Screens — Admin</title>
  <link rel="stylesheet" href="/splash/splash.css">
  <script src="/splash/splash.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=EB+Garamond:wght@400;500&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Serif+Hebrew:wght@400;500;700&family=David+Libre:wght@400;500;700&family=Heebo:wght@400;500;700&family=Rubik:wght@400;500;700&family=Assistant:wght@400;600;700&family=Playfair+Display:wght@400;500;700&family=Lora:wght@400;500;700&family=Inter:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { background: #12100C; color: #EFE3C0; font-family: 'Frank Ruhl Libre', Georgia, serif; }

    /* ── Mobile-only adjustments (no effect on desktop ≥768px) ── */
    @media (max-width: 767px) {
      /* Inputs must be ≥16px or iOS Safari auto-zooms the page on focus,
         which is the single biggest "broken on my phone" feel. */
      input, textarea, select { font-size: 16px !important; }
      /* 44px minimum tap targets (Apple HIG) without touching each component.
         Switches keep their own enlarged hit area; checkboxes/radios sit
         inside tappable labels. min-height is ignored by inline elements, so
         links inside running text are unaffected. */
      button:not([role="switch"]), select, a, summary,
      input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="color"]):not([type="hidden"]) {
        min-height: 44px !important; /* beats smaller inline minHeight values */
      }
      input[type="checkbox"], input[type="radio"] { min-width: 20px; min-height: 20px; }
      button, a { -webkit-tap-highlight-color: transparent; }
      /* Hide horizontal scrollbar on the tab nav (WebKit) */
      nav::-webkit-scrollbar { display: none; }
    }
  </style>
</head>
<body>
  <!-- Start-up animation (public/splash/). Removed by splash.js once the app is ready. -->
  <div id="tt-splash" aria-hidden="true">
    <div class="tt-stage">
      <img src="/splash/back.webp" alt="">
      <img class="tt-flap-open" src="/splash/flap-open.webp" alt="">
      <div class="tt-card-clip"><div class="tt-card-move">
        <img src="/splash/card.webp" alt="">
        <img class="tt-letters" src="/splash/letters.webp" alt="">
        <div class="tt-shine"></div>
      </div></div>
      <img src="/splash/pocket.webp" alt="">
      <img class="tt-flap-closed" src="/splash/flap-closed.webp" alt="">
      <img class="tt-seal" src="/splash/seal.webp" alt="">
    </div>
    <img src="/splash/shine-mask.webp" alt="" style="display:none">
  </div>
  <div id="root"></div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
